version: "10.0"
description: Schema for version 10.0 Eliware directive documents and records.
record:
  type: object
  required:
    - id
    - dos
    - donts
  properties:
    id:
      type: string
      pattern: ^(E|A)-[0-9]+(?:\.[0-9]+)*$
    dos:
      type: array
      items:
        type: string
        minLength: 1
        pattern: \S
      minItems: 1
    donts:
      type: array
      items:
        type: string
        minLength: 1
        pattern: \S
      minItems: 1
    directives:
      type: array
      items:
        $ref: "#/$defs/directive"
      minItems: 1
    examples:
      type: array
      items:
        type: object
        required:
          - purpose
          - markdown
        properties:
          purpose:
            type: string
            minLength: 1
            pattern: \S
          markdown:
            type: string
            minLength: 1
            pattern: \S
          generalHeadings:
            type: array
            items:
              type: string
              minLength: 1
              pattern: \S
          profileHeadings:
            type: object
            properties:
              application: { type: array, items: { type: string } }
              cli: { type: array, items: { type: string } }
              discord: { type: array, items: { type: string } }
              mcp-server: { type: array, items: { type: string } }
              web: { type: array, items: { type: string } }
              library: { type: array, items: { type: string } }
              infrastructure: { type: array, items: { type: string } }
              workspace: { type: array, items: { type: string } }
              documentation: { type: array, items: { type: string } }
              npm-published: { type: array, items: { type: string } }
              ghcr-published: { type: array, items: { type: string } }
              private: { type: array, items: { type: string } }
            additionalProperties: false
        additionalProperties: false
  additionalProperties: false
$defs:
  directive:
    type: object
    required:
      - id
      - dos
      - donts
    properties:
      id:
        type: string
        pattern: ^(E|A)-[0-9]+(?:\.[0-9]+)*$
      dos:
        type: array
        items:
          type: string
          minLength: 1
          pattern: \S
        minItems: 1
      donts:
        type: array
        items:
          type: string
          minLength: 1
          pattern: \S
        minItems: 1
      directives:
        type: array
        items:
          $ref: "#/$defs/directive"
        minItems: 1
      examples:
        type: array
        items:
          type: object
          required:
            - purpose
            - markdown
          properties:
            purpose:
              type: string
              minLength: 1
              pattern: \S
          markdown:
            type: string
            minLength: 1
            pattern: \S
          generalHeadings:
            type: array
            items:
              type: string
              minLength: 1
              pattern: \S
          profileHeadings:
            type: object
            properties:
              application: { type: array, items: { type: string } }
              cli: { type: array, items: { type: string } }
              discord: { type: array, items: { type: string } }
              mcp-server: { type: array, items: { type: string } }
              web: { type: array, items: { type: string } }
              library: { type: array, items: { type: string } }
              infrastructure: { type: array, items: { type: string } }
              workspace: { type: array, items: { type: string } }
              documentation: { type: array, items: { type: string } }
              npm-published: { type: array, items: { type: string } }
              ghcr-published: { type: array, items: { type: string } }
              private: { type: array, items: { type: string } }
            additionalProperties: false
          additionalProperties: false
    additionalProperties: false
document:
  type: object
  required:
    - version
    - description
    - directives
  properties:
    version:
      type: string
      minLength: 1
      pattern: \S
    description:
      type: string
      minLength: 1
      pattern: \S
    directives:
      type: array
      minItems: 1
      items:
        $ref: "#/$defs/directive"
  additionalProperties: false
