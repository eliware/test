version: "12.0"
description: Defines canonical order for package.json keys.
orders:
  topLevelKeys:
    - name
    - version
    - description
    - keywords
    - private
    - publishConfig
    - main
    - bin
    - files
    - scripts
    - engines
    - dependencies
    - devDependencies
    - jest
    - prettier
    - author
    - license
    - repository
    - homepage
    - bugs
    - eliware
  eliwareKeys:
    - id
    - apply
    - exempt
