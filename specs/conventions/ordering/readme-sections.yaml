version: "12.0"
description: Defines cross-profile title, section, and profile order in README.md.
orders:
  header:
    - brand
    - title-and-badges
    - description
    - table-of-contents
  headerLines:
    brand: 0
    title-and-badges: 2
    description: 4
    table-of-contents: 6
  tableOfContentsHeading: Table of Contents
  badgeOrder:
    - npm
    - License
    - CI
  generalSections:
    - Features
    - Requirements
    - Setup
    - Usage
    - Development
    - Testing
    - Troubleshooting
    - Security
  profileOrder:
    - application
    - cli
    - discord
    - mcp-server
    - web
    - library
    - infrastructure
    - workspace
    - documentation
    - npm-published
    - ghcr-published
    - private
  profileSections:
    application:
      - Configuration
      - Operations
    cli:
      - Exit codes
    discord:
      - Events
      - Intents and permissions
    mcp-server:
      - Tools
      - Resources
      - Prompts
      - Transport
      - Authentication
      - Schemas
    web:
      - Routes
      - Assets
      - Development server
      - Build
      - Deployment
    library:
      - API
      - Packaging
      - Examples
    infrastructure:
      - Managed targets
      - Configuration
      - Desired state
      - Validation
      - Change boundaries
    workspace:
      - Runbooks
      - Communication
      - Recovery
    documentation:
      - Scope
      - Navigation
      - Contribution
      - Documentation validation
    npm-published: []
    ghcr-published: []
    private: []
  finalSections:
    - Support
    - Links
    - License
  linksSectionOrder:
    - Home Page
    - GitHub Org
    - GitHub Repo
    - Bug Reports
    - npm
    - Discord
  headerTemplates:
    brand: "# [![eliware.org](https://eliware.org/logos/brand.png)](https://discord.gg/M6aTR9eTwN)"
    title: "## @eliware/<repo-name>"
    npmBadge: "[![npm](https://img.shields.io/npm/v/@eliware/<repo-name>)](https://www.npmjs.com/package/@eliware/<repo-name>)"
    licenseBadge: "[![License](https://img.shields.io/github/license/eliware/<repo-name>)](https://github.com/eliware/<repo-name>/blob/main/LICENSE)"
    ciBadge: "[![CI](https://github.com/eliware/<repo-name>/actions/workflows/ci.yaml/badge.svg)](https://github.com/eliware/<repo-name>/actions/workflows/ci.yaml)"
  supportBlock: "For help, questions, or to chat with the author and community, visit:\n\n[![Discord](https://eliware.org/logos/discord_96.png)](https://discord.gg/M6aTR9eTwN)[![eliware.org](https://eliware.org/logos/eliware_96.png)](https://discord.gg/M6aTR9eTwN)\n\n**[eliware.org on Discord](https://discord.gg/M6aTR9eTwN)**"
  licenseLink: "[MIT © Eliware](LICENSE)"
  sharedSections:
    Commands:
      profiles:
        - cli
        - discord
