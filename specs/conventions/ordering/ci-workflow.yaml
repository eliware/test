version: "15.0"
description: Defines shared CI validation step order.
orders:
  validationSteps:
    - checkout
    - setup-node
    - install-npm
    - npm-ci
    - npm-test
  stepValues:
    checkout: actions/checkout@v7
    setup-node: actions/setup-node@v7
    install-npm: npm -g install npm@latest
    npm-ci: npm ci
    npm-test: npm test
  checkoutOptions:
    fetch-depth: 0
