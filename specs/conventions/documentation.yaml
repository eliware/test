version: "11.0"
description: Applies only to documentation-only repositories.
requires:
  - private
directives:
  - id: E-0.1.100
    dos:
      - These conventions apply to a repository that ships no application or library runtime code. Validation scripts, tests, and test fixtures used only to validate the documentation repository are allowed.
    donts:
      - Documentation-only repositories must not omit applicable documentation requirements.
    directives:
      - id: A-0.1.100.0
        dos:
          - Every documentation-only repository must extend the general AGENTS.md requirements with applicable documentation guidance.
        donts:
          - A documentation-only repository must not omit AGENTS.md.
        directives:
          - id: A-0.1.100.0.1
            dos:
              - "After the seven general AGENTS.md headings, add a ## Documentation section. Document documentation scope, indexes, link validation, and documentation-only limits."
            donts:
              - AGENTS.md must not allow implementation code or undocumented canonical policy in a documentation-only repository.
      - id: E-0.1.100.1
        dos:
          - Documentation-only repositories use root README.md as their documentation entry point and specs/README.md to index structured records. Root README.md must link specs/README.md; a separate docs/ subfolder or docs/README.md is not required.
        donts:
          - Documentation-only repositories must not leave required documentation surfaces undiscoverable or introduce implementation code as canonical policy.
      - id: A-0.1.100.2
        dos:
          - Under the Scope, Navigation, Contribution, and Documentation validation headings assigned to documentation by general.yaml, document repository scope, documentation sources, indexes, contribution/setup requirements, and documentation-specific link/index validation. The Documentation validation heading does not replace the shared npm test, lint, format, or audit requirements. Include the headings in the Table of Contents as required by general.yaml.
          - During change review, a human or AI reviewer must identify the repository's documentation surfaces, assess whether each is indexed, and record relevant findings with the change. Deterministic link checks verify only that supported declared links resolve; they do not establish index completeness.
        donts:
          - Documentation-only README.md must not present implementation code, operational procedures, or duplicated canonical content.
      - id: A-0.1.100.3
        dos:
          - Deterministic validation must verify that every repository-relative Markdown link and structured-document path resolves to an existing target, and that every Markdown fragment resolves. External links are checked for valid URL form only; human or AI review confirms their availability and intended target.
        donts:
          - Do not leave a documented path or embedded reference pointing to a missing target.
