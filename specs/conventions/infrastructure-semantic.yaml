version: "13.0"
description: Lists semantic rules for Eliware infrastructure repositories.
requires:
  - general
  - private
conflicts:
  - application
  - database
  - cli
  - web
  - discord
  - mcp-server
  - library
  - documentation
  - workspace
  - npm-published
  - ghcr-published
directives:
  - id: E-0.1.9.0.0
    dos:
      - Define each managed target, environment, owner, target configuration, and
        deployment input from maintained configuration and schemas.
      - If the document has target and environment fields, use indexed sections for each field.
      - Define repository-specific paths, schemas, validation, and platform boundaries in
        indexed specifications.
      - Describe change control, rollback, secret handling, and ownership from linked
        Operations procedures and workspace runbooks.
      - Use a SHA-256 digest for each production Kubernetes image identifier.
      - Restore each backup to an isolated test target before certification.
      - Check the integrity of each restored backup before certification.
      - Remove restored test data after the checks.
      - Record the backup identifier, restore result, integrity result, cleanup result,
        and time before certification.
      - Keep the committed target configuration canonical in its owning repository.
      - Link from README.md to canonical operational procedures in Eliware Operations or
        the owning workspace.
      - Compare target and platform claims with maintained configuration, schemas,
        validation code, workflows, and linked runbooks.
    donts:
      - Do not put settings for multiple targets in one record unless its schema defines
        one shared target.
      - Do not use a general rule to prove platform-specific behavior.
      - Do not confuse committed inputs with current platform status.
      - Do not duplicate canonical operational procedures in the repository.
