version: "13.0"
description: Lists deterministic rules for documentation-only Eliware repositories.
directives:
  - id: E-0.1.1.1.0
    dos:
      - Add a Documentation section to AGENTS.md.
      - Add Scope, Navigation, Contribution, and Documentation validation sections to
        README.md.
    donts:
      - Do not omit a documentation-specific section.
    examples:
      - "## Documentation"
      - "## Scope


        ## Navigation


        ## Contribution


        ## Documentation validation"
