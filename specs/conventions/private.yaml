version: "11.0"
description: Applies to repositories that are not publicly published as npm packages.
requires: []
directives:
  - id: E-0.1.150
    dos:
      - Private repositories must list the private profile name in package.json.eliware.apply; its rules are defined in private.yaml. They must set package.json private to true.
      - Documentation, workspace, and infrastructure repositories are expected to contain proprietary internal information, including private hostnames, usernames, filesystem paths, and access details; they must remain private.
      - Private repositories may publish authorized GHCR images without becoming npm packages.
    donts:
      - Private repositories must not publish npm packages or expose npm publication credentials.
      - Skipping public identifier-pattern checks under E-0.1.7 does not skip the human or AI secret, plaintext-data, private-data, backup, or runtime-state review required by E-0.1.6. Encrypted secret payloads may be committed; any retained plaintext secret must be covered by the package.json.eliware.exempt record for the finding rule ID, using the shared exemption schema in general.yaml.
    directives:
      - id: E-0.1.150.0
        dos:
          - "After the seven general AGENTS.md headings, add a ## Private distribution section. Document private distribution restrictions, access boundaries, and non-public publication rules."
        donts:
          - Private repositories must not present public npm identity, public registry claims, or unrestricted deployment instructions.
      - id: A-0.1.150.1
        dos:
          - The .github/workflows/ci.yaml workflow in a private repository must contain validation only. When ghcr-published is also applied, its separately authorized publication workflow may publish only on exact v#.#.# tags.
        donts:
          - Do not include publication or deployment commands, npm publication jobs, or publication credentials in .github/workflows/ci.yaml. Do not publish from branches or pull requests.
