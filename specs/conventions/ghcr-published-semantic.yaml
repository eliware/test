version: "13.0"
description: Defines semantic repository requirements for Eliware container distribution.
requires:
  - general
conflicts:
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.11.0.0
    dos:
      - Document image purpose, visibility, architectures, access boundaries, and
        deployment use from the image workflow, package settings, and access policy.
      - Name each build input owner and architecture decision from repository settings and
        workflow files.
      - Keep publication and deployment authorization separate.
      - Check that publication workflows do not trigger automatic deployments through called
        workflows or external services.
      - Describe latest only as a mutable convenience alias.
      - Compare image claims with workflow files, build definitions, package metadata, and
        deployment documentation.
    donts:
      - Do not imply publication authorization from profile selection or workflow presence.
      - Do not identify releases or deployments solely by mutable tags.
      - Do not embed automatic deployment in the publication workflow.
