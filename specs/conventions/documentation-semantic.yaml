version: "12.0"
description: Lists semantic rules for documentation-only Eliware repositories.
requires:
  - general
conflicts:
  - application
  - cli
  - web
  - discord
  - mcp-server
  - library
  - workspace
  - infrastructure
  - npm-published
  - ghcr-published
directives:
  - id: E-0.1.1.0.0
    dos:
      - Keep contents focused on documentation and structured records.
      - Limit implementation tooling to validation of the documentation repository.
      - Explain documentation scope, ownership, authoritative sources, contribution expectations, and documentation-only boundaries.
      - Make navigation sufficient to discover maintained documentation.
    donts:
      - Do not ship application or library runtime behavior as documentation-only content.
