version: "12.0"
description: Defines deterministic repository requirements for Eliware npm publication.
requires:
  - general
conflicts:
  - documentation
  - workspace
  - infrastructure
  - private
directives:
  - id: E-0.1.10.1.0
    dos:
      - Set private false and publishConfig.provenance true.
      - Add an npm publication section to AGENTS.md.
      - Include the canonical npm badge beside the README title and a public package link.
      - For consumer repositories, define pack as eliware-test --pack and run package validation during aggregate validation.
    donts:
      - Do not replace required package validation with script presence.
    examples:
      - "## npm publication"
      - "[![npm](https://img.shields.io/npm/v/@eliware/example)](https://www.npmjs.com/package/@eliware/example)"

  - id: E-0.1.10.1.1
    dos:
      - Define files as distinct nonempty safe repository-relative paths.
      - Include the base entries listed in ordering/package-files.yaml.
      - Include specs/ for @eliware/test.
      - Include package.json, README.md, AGENTS.md, LICENSE, and specs/ in the tarball.
      - Include every declared runtime entrypoint, export, and declaration target.
      - Include tracked .env-prefixed example files whose names end in .example.
      - Allow additional runtime files and folders at any depth unless excluded.
      - Exclude tests, test-fixtures, .github, .knit, .git, node_modules, coverage, dist, build, generated, artifacts, and test-results directories at every depth.
      - Exclude .gitignore and package-lock.json at every depth.
      - Exclude .env-prefixed files unless their names end in .example.
      - Validate actual packed contents against minimum contents and exclusions.
    donts:
      - Do not impose an exact allowlist or let extras bypass exclusions.
      - Do not use absolute or traversing files entries.
      - Do not maintain .npmignore or packaging lifecycle scripts prepare, prepublish, prepublishOnly, prepack, or postpack.
    examples:
      - '{"files":["src/","docs/","examples/","specs/","README.md","AGENTS.md","LICENSE","RELEASE_NOTES.md","assets/","data.json"]}'
      - "assets/templates/email.html is permitted but assets/tests/example.json is excluded."
      - ".env.production.example is permitted but .env.production is excluded."

  - id: E-0.1.10.1.2
    dos:
      - Use setup-node major v7 with Node.js 26 for the npm publisher.
      - Set registry-url to https://registry.npmjs.org and package-manager-cache to false.
      - Install npm latest before npm ci in the npm publisher.
      - Use one unconditional standalone npm publish --provenance step.
    donts:
      - Do not declare NPM_TOKEN or NODE_AUTH_TOKEN in workflow environment or setup.
    examples:
      - "uses: actions/setup-node@v7\nwith:\n  node-version: 26\n  registry-url: https://registry.npmjs.org\n  package-manager-cache: false"
      - "run: npm publish --provenance"
