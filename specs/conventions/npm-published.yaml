version: "10.0"
description: Applies to repositories that publish a public npm package.
requires: []
directives:
  - id: E-0.1.140
    dos:
      - Repositories that publish a public npm package must list the npm-published profile name in package.json.eliware.apply; its rules are defined in npm-published.yaml.
      - Public npm packages must set private to false.
    donts:
      - Do not publish an npm package without declaring the npm-published profile or while private is true.
    directives:
      - id: E-0.1.140.0
        dos:
          - "After the seven general AGENTS.md headings, add a ## npm publication section. Document package identity and version source, exact files allowlist, pack validation command and required result, provenance mechanism, exact-version registry verification, and the release authorization/handoff boundary. Document release gates and who is authorized to approve or execute them, but do not treat this documentation or the profile as permission for an agent to publish. Publication still requires explicit authorization through the applicable Operations release handoff."
        donts:
          - Do not omit npm publication requirements from AGENTS.md.
      - id: E-0.1.140.1
        dos:
          - Public npm packages must declare engines.node compatible with Node.js 26, publishConfig.provenance true, and a non-empty files allowlist containing README.md, LICENSE, RELEASE_NOTES.md, docs/, and specs/.
          - Public npm package README.md must include the npm badge, npm package link, installation guidance, package entrypoints, and release/version guidance. When npm-published is applied without a library profile, include this material in Usage or an applicable profile section rather than inventing a library API section.
          - Public npm packages must define pack=eliware-test --pack. The @eliware/test package alone must define pack=node bin/eliware-test.mjs --pack. Every public npm package, including @eliware/test, must execute and pass the harness pack stage during aggregate validation and before publication; the pack script command does not replace either required stage. The shared audit script is defined by general.yaml.
        donts:
          - Do not omit pack, skip the harness pack stage, or publish a package without passing it.
      - id: A-0.1.140.2
        dos:
          - Public npm repositories must contain exactly one publication workflow at .github/workflows/publish.yml in addition to .github/workflows/ci.yml; no other GitHub Actions workflow files are allowed. If GHCR publication is also applied, both publication profiles use this single publish.yml file.
          - Publication workflows must use the GitHub Actions glob `v[0-9]*.[0-9]*.[0-9]*` as a candidate filter, then enforce the exact `vMAJOR.MINOR.PATCH` numeric form in the publish job and require that it matches package.json. The publication job must depend on successful Ubuntu validation using npm ci followed by npm test. The npm publish step must be unconditional and must not set continue-on-error.
          - Use the copyable GitHub Actions workflow example below as the canonical npm publication workflow; adapt only package-specific names or required project validation commands. Static validation verifies workflow declarations and cannot prove GitHub environment protection or reviewer settings; verify those settings in GitHub before each authorized release.
        donts:
          - Do not use broad tag filters that start publication workflows for prerelease or non-version tags, publish from branches or pull requests, or publish a tag whose version differs from package.json.
        examples:
          - purpose: Copyable GitHub Actions workflow for npm Trusted Publishing with a separate validation gate
            markdown: |-
              ```yaml
              name: Publish

              on:
                push:
                  tags:
                    - "v[0-9]*.[0-9]*.[0-9]*"

              concurrency:
                group: ${{ github.repository }}-${{ github.ref }}
                cancel-in-progress: true

              permissions:
                contents: read

              jobs:
                validate:
                  runs-on: ubuntu-latest
                  permissions:
                    contents: read
                  steps:
                    - uses: actions/checkout@v6
                    - uses: actions/setup-node@v7
                      with:
                        node-version: 26
                        cache: npm
                    - run: npm ci
                    - run: npm test

                publish:
                  needs: validate
                  runs-on: ubuntu-latest
                  permissions:
                    contents: read
                    id-token: write
                  steps:
                    - uses: actions/checkout@v6
                    - uses: actions/setup-node@v7
                      with:
                        node-version: 26
                        registry-url: https://registry.npmjs.org
                        package-manager-cache: false
                    - run: npm ci
                    - shell: bash
                      run: |
                        [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] && test "$(node -p "require(process.argv[1]).version" ./package.json)" = "${GITHUB_REF_NAME#v}"
                    - run: npm publish --provenance
              ```
      - id: A-0.1.140.3
        dos:
          - An npm publication workflow must be separate from the general validation workflow, inherit general.yaml validation requirements, and make its publication job depend on successful Ubuntu validation using npm ci followed by npm test, as well as exact tag/package-version checks.
          - "The validation job must not receive id-token: write; scope that permission to the publication job only."
        donts:
          - Do not treat npm publication steps as part of general CI validation or add npm publication credentials to validation-only jobs.
      - id: A-0.1.140.4
        dos:
          - "An npm-only publication job must grant exactly contents: read and id-token: write. A combined npm/GHCR publication job must grant exactly the union of the permissions required by both profiles. The workflow-level permission map must be exactly contents: read; publication permissions belong only on the publication job."
          - GitHub Actions npm Trusted Publishing must run on a GitHub-hosted runner with Node.js 26 and npm 11.5.1 or later, use actions/setup-node@v7, and publish with npm publish --provenance.
          - Configure the npm Trusted Publisher with the exact GitHub owner, repository, and workflow filename publish.yml, and allow direct npm publish for workflows that use that command.
          - "Grant id-token: write only to the publication job. Do not pass NPM_TOKEN or NODE_AUTH_TOKEN or configure token-based npm publishing credentials in the workflow."
        donts:
          - Do not place npm publication tokens in validation-only jobs or report successful publication before exact-version registry verification.
          - Do not grant OIDC permissions to validation jobs, use a workflow identity that differs from the npm Trusted Publisher configuration, or use npm CLI below 11.5.1 for a trusted publish.
        examples:
          - purpose: Exact permissions for a combined npm and GHCR publication job
            markdown: |-
              permissions:
                contents: read
              jobs:
                validate:
                  permissions:
                    contents: read
                publish:
                  permissions:
                    contents: read
                    id-token: write
                    packages: write
                    attestations: write
                    artifact-metadata: write

              The publication job may use the union only when both publication profiles apply. The validation job receives no publication permissions.
      - id: A-0.1.140.5
        dos:
          - "A GitHub npm publication workflow must use npm Trusted Publishing without static npm credentials, grant id-token: write only to its publication job, use the documented setup-node v7 runtime configuration, and publish with provenance. The workflow-level permission map must be exactly contents: read; grant OIDC only through the publication job's profile-required exact permission map."
        donts:
          - "Do not inherit id-token: write from workflow-level permissions, grant it to a validation job, pass NPM_TOKEN or NODE_AUTH_TOKEN, or publish without the provenance option."
