version: "14.0"
description: Lists deterministic rules for Eliware applications and services.
directives:
  - id: E-0.1.4.1.0
    dos:
      - Add an Application section to AGENTS.md.
      - Add Configuration and Operations sections to README.md.
      - When examples/ contains maintained .mjs or .js files, maintain examples/README.md
        linking each JavaScript example.
      - Exclude generated output directories from index discovery.
      - Keep implementation modules in src/, launchers in bin/, tests in tests/,
        fixtures in test-fixtures/, and examples in examples/.
      - Tell developers to run focused tests first during development.
      - Pass one or more test paths to npm test for focused testing.
      - Show valid npm test commands for one test file and multiple test files.
      - Tell developers to prevent repeated full-suite runs during development.
      - Require the full npm test suite for final validation before a commit, milestone,
        or release.
    donts:
      - Do not require examples/ solely because application is selected.
      - Do not omit maintained JavaScript examples from examples/README.md.
    examples:
      - /eliware/application-template/AGENTS.md
      - /eliware/application-template/README.md

  - id: E-0.1.4.1.1
    dos:
      - When bin exists, make each target a nonempty repository-relative path to an
        existing file in bin/.
      - Remove one leading ./ and convert backslash separators to forward slashes before checks.
      - Do not use . or .. path segments.
      - Allow one leading ./ segment.
      - Do not use symbolic links in bin target paths.
      - Give bin object keys nonempty names containing ASCII letters, digits, underscores,
        dots, or hyphens.
      - When start exists, include a standalone token matching a declared entrypoint after
        removing optional quotes and leading ./.
    donts:
      - Do not require package.json.bin for the Application profile.
      - Do not declare invalid names, escaping paths, or entrypoints that are not in bin/.
    examples:
      - /eliware/application-template/package.json
      - /eliware/application-template/bin/application-template.mjs

  - id: E-0.1.4.1.2
    dos:
      - Keep implementation in src/ and launchers in bin/.
      - Put implementation modules in src/. Put launchers in bin/.
      - Allow package-script validator files under scripts/.
      - Put tests in tests/, fixtures in test-fixtures/, and examples in
        examples/.
      - Mirror each src/ .mjs file with exactly one same-path tests/ .test.mjs file.
      - Give each test file a matching source path and an executable Jest test callback.
      - Keep unmatched fixtures, snapshots, generators, and test support in root
        test-fixtures/.
      - Keep generated test output in ignored artifacts/.
      - Limit each src/ .mjs file to 150 physical lines and each tests/ .test.mjs file to 300.
      - Include empty lines, comments, and the final unterminated line in counts.
      - >-
        Define a pure export barrel with these allowed contents: top-level static imports,
        source re-exports, or local exports.
      - Require local exports to expose exactly the imported binding names.
      - Mark a barrel public only when its normalized path matches a main, bin, or
        exports target in package.json.
    donts:
      - Do not put other implementation modules under scripts/.
      - Do not impose a line limit on bin/ launchers.
      - Do not exclude source files from mirroring or line limits for coverage exclusions.
      - Do not put generated output or unmatched tests and support files in src/ or
        tests/.
      - Do not count skipped, todo, or describe-only declarations. They are not executable tests.
      - Do not use internal pure export barrels.
    examples:
      - /eliware/application-template/src/main.mjs
      - /eliware/application-template/tests/main.test.mjs

  - id: E-0.1.4.1.3
    dos:
      - Run required Jest tests through eliware-test with the exact configuration shown.
      - For @eliware/test, allow direct dependencies on @jest/globals, jest, and
        istanbul-lib-instrument.
      - For @eliware/test, allow istanbul-lib-instrument imports and direct Jest commands
        outside package scripts.
      - Allow listed harness tools only in @eliware/test.
      - Use mocked file-system operations in each test suite.
      - Mock file-handle write methods or inject mocked file handles.
      - Allow network requests to localhost only.
      - Use fake timers or injected fixed clocks.
      - Mock child-command calls and other external effects.
      - Use Istanbul coverage for production .mjs files in src/.
      - Require 100 percent coverage for statements, branches, functions, and lines.
      - Keep passing test runs without console or child-command output.
    donts:
      - Do not modify files in tests.
      - Do not access external network services in tests.
      - Do not launch OS commands or command-line tools in tests.
      - Do not use wall-clock waits, sleeps, or uncontrolled timers in tests.
      - Do not invoke Jest or coverage tools directly in consumer repositories.
      - Do not use a different test runner.
      - Do not use a different coverage engine.
      - Do not add more Jest configuration.
      - Do not use production coverage exclusions or Istanbul ignore directives.
    examples:
      - /eliware/application-template/package.json
