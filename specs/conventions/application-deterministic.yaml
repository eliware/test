version: "13.0"
description: Lists deterministic rules for Eliware applications and services.
requires:
  - general
conflicts:
  - library
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.4.1.0
    dos:
      - Add an Application section to AGENTS.md.
      - Add Configuration and Operations sections to README.md.
      - Keep docs/README.md.
      - Link docs/README.md from root README.md.
      - Index every Markdown document beneath docs/ except its index.
      - When examples/ contains .mjs or .js examples, maintain examples/README.md linking
        every JavaScript example.
      - Keep implementation modules under src/, launchers under bin/, tests under tests/,
        fixtures under test-fixtures/, and examples under examples/.
      - Tell developers to run focused tests first during development.
      - Show valid npm test commands for one test file and multiple test files.
      - Tell developers to avoid repeated full-suite runs during development.
      - Require the full npm test suite for final validation before a commit, milestone,
        or release.
    donts:
      - Do not require examples/ solely because application is selected.
      - Do not leave discovered docs documents or JavaScript examples unindexed.
    examples:
      - "## Application"
      - "Run focused tests first during development.

        Run one test file with `npm test -- tests/path/to/example.test.mjs`.

        Run multiple test files with `npm test -- tests/path/to/first.test.mjs
        tests/path/to/second.test.mjs`.

        Avoid repeated full-suite runs during development.

        Run the full `npm test` suite for final validation before a commit, milestone,
        or release."
      - "## Configuration\n\n## Operations"

  - id: E-0.1.4.1.1
    dos:
      - When bin exists, make each target a nonempty repository-relative path to an
        existing file under bin/.
      - Give bin object keys nonempty names containing ASCII letters, digits, underscores,
        dots, or hyphens.
      - When start exists, include a standalone token matching a declared entrypoint after
        removing optional quotes and leading ./.
    donts:
      - Do not require package.json.bin for the Application profile.
      - Do not declare invalid names, escaping paths, or entrypoints outside bin/.
    examples:
      - '{"bin":{"example":"./bin/example.mjs"},"scripts":{"start":"node
        bin/example.mjs"}}'

  - id: E-0.1.4.1.2
    dos:
      - Keep implementation under src/ and launchers under bin/.
      - Put implementation modules under src/. Put launchers under bin/.
      - Put tests under tests/, fixtures under test-fixtures/, and examples under
        examples/.
      - Mirror every src/ .mjs file with exactly one same-path tests/ .test.mjs file.
      - Give every test file a matching source, executable Jest test callback, and
        matching source reference.
      - Keep unmatched fixtures, snapshots, generators, and test support under root
        test-fixtures/.
      - Keep generated test output under ignored artifacts/.
      - Limit every .mjs file under src/ to 100 physical lines and every .test.mjs file
        under tests/ to 200.
      - Count blank lines, comments, and unterminated final lines.
      - Define a pure export barrel as a nonempty module with only top-level static
        imports, source re-exports, or local exports.
      - Require local exports to expose exactly the imported binding names.
      - Treat a barrel as public only when its normalized path matches a main, bin, or
        exports target in package.json.
    donts:
      - Do not impose a line limit on bin/ launchers.
      - Do not exempt sources from mirroring or line limits because of coverage exclusions.
      - Do not put generated output or unmatched tests and support files under src/ or
        tests/.
      - Do not count skipped, todo, or describe-only declarations as executable tests.
      - Do not use internal pure export barrels.
    examples:
      - "src/runtime/configuration.mjs mirrors tests/runtime/configuration.test.mjs."

  - id: E-0.1.4.1.3
    dos:
      - Run required Jest tests through eliware-test with the exact configuration shown.
      - Use mocked file-system operations in every test suite.
      - Allow network access to localhost only.
      - Use fake timers or injected fixed clocks.
      - Mock process calls and other external effects.
      - Use Istanbul coverage for production .mjs files under src/.
      - Reach 100 percent statements, branches, functions, and lines with zero uncovered
        lines.
      - Keep successful test runs free of console and process output.
    donts:
      - Do not change file-system state in tests.
      - Do not access external network services in tests.
      - Do not launch real processes or command-line tools in tests.
      - Do not use wall-clock waits, sleeps, or uncontrolled timers in tests.
      - Do not directly invoke Jest, import its runner, or directly declare Jest packages.
      - Do not substitute other test runners.
      - Do not substitute other coverage engines.
      - Do not add separate Jest configuration.
      - Do not use production coverage exclusions or Istanbul ignore directives.
    examples:
      - >-
        {"testEnvironment":"node","testMatch":["**/tests/**/*.test.mjs"],
        "collectCoverageFrom":["src/**/*.mjs"],"coverageReporters":["text","json-summary"],
        "coverageThreshold":{"global":{"branches":100,"functions":100,"lines":100,
        "statements":100}}}

  - id: E-0.1.4.1.4
    dos:
      - Keep RELEASE_NOTES.md.
      - Link RELEASE_NOTES.md from README.md Usage.
      - Use the exact level-one title and level-two entry formats shown.
      - Use versioned level-two entries only.
      - Keep at least one versioned release entry.
      - Match the newest versioned entry with package.json.version.
      - Require a v<version> repository tag for every older release entry.
      - Allow the current package.json.version without a repository tag.
      - Make all repository tags available during validation.
      - Use valid calendar dates, strictly descending numeric SemVer versions, and
        non-increasing dates.
      - Give every entry at least one level-three category from Added, Changed, Fixed,
        Breaking changes, Migration, or Security.
      - Give each category user-visible change text.
      - Do not repeat categories within one entry.
    donts:
      - Do not use the word Unreleased in RELEASE_NOTES.md.
      - Do not duplicate versions.
      - Do not use malformed, empty, unsupported, or out-of-order sections.
      - Do not put text outside a release category.
      - Do not put headings outside a release entry or category.
    examples:
      - "# Release Notes


        ## 13.0.0 — 2026-06-01


        ### Added


        Initial release."
