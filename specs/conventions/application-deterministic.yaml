version: "12.0"
description: Lists deterministic rules for Eliware applications and services.
requires: []
directives:
  - id: E-0.1.4.1.0
    dos:
      - Add Application to AGENTS.md at the canonical profile position.
      - Add Configuration and Operations to README.md and its Table of Contents.
      - Keep docs/README.md and link it from root README.md.
      - Index every Markdown document beneath docs/ except its index.
      - When examples/ contains .mjs or .js examples, maintain examples/README.md linking every example.
      - Keep implementation modules under src/, launchers under bin/, tests under tests/, fixtures under test-fixtures/, and examples under examples/.
    donts:
      - Do not require examples/ solely because application is selected.
      - Do not leave discovered documentation or examples unindexed.
    examples:
      - "## Application"
      - "## Configuration\n\n## Operations"

  - id: E-0.1.4.1.1
    dos:
      - Set at least one runtime entrypoint through main or bin.
      - Make every main and bin target a nonempty repository-relative path to an existing file under bin/.
      - Give bin object keys nonempty names containing ASCII letters, digits, underscores, dots, or hyphens.
      - When start exists, include a standalone token matching a declared entrypoint after removing optional quotes and leading ./.
    donts:
      - Do not declare invalid names, escaping paths, or entrypoints outside bin/.
    examples:
      - '{"bin":{"example":"./bin/example.mjs"},"scripts":{"start":"node bin/example.mjs"}}'

  - id: E-0.1.4.1.2
    dos:
      - Keep implementation under src/ and launchers under bin/.
      - Keep maintained JavaScript, TypeScript, and JSX modules under src/, except launchers under bin/, tests under tests/, fixtures under test-fixtures/, and examples under examples/.
      - Mirror every src/ .mjs file with exactly one same-path tests/ .test.mjs file.
      - Give every test file a matching source, executable Jest test callback, and matching source reference.
      - Keep unmatched fixtures, snapshots, generators, and test support under root test-fixtures/.
      - Keep generated test output under ignored artifacts/.
      - Limit every .mjs file under src/ to 100 physical lines and every .test.mjs file under tests/ to 200.
      - Count blank lines, comments, and unterminated final lines.
    donts:
      - Do not impose a line limit on bin/ launchers.
      - Do not exempt sources from mirroring or line limits because of coverage exclusions.
      - Do not put generated output or unmatched tests and support files under src/ or tests/.
      - Do not count skipped, todo, or describe-only declarations as executable tests.
      - Do not use internal pure export barrels.
    examples:
      - "src/runtime/configuration.mjs mirrors tests/runtime/configuration.test.mjs."

  - id: E-0.1.4.1.3
    dos:
      - Run required Jest tests through eliware-test with the exact configuration shown.
      - Use Istanbul coverage for production .mjs files under src/.
      - Reach 100 percent statements, branches, functions, and lines with zero uncovered lines.
      - Keep successful test runs free of console and process output unless explicitly asserted by tests.
    donts:
      - Do not directly invoke Jest, import its runner, or directly declare Jest packages.
      - Do not substitute other runners or coverage engines or add separate Jest configuration.
      - Do not use production coverage exclusions or Istanbul ignore directives.
    examples:
      - '{"testEnvironment":"node","testMatch":["**/tests/**/*.test.mjs"],"collectCoverageFrom":["src/**/*.mjs"],"coverageReporters":["text","json-summary"],"coverageThreshold":{"global":{"branches":100,"functions":100,"lines":100,"statements":100}}}'

  - id: E-0.1.4.1.4
    dos:
      - Keep RELEASE_NOTES.md and link it from README.md Links.
      - Use the exact level-one title and level-two entry formats shown.
      - Allow one Unreleased section before versioned entries.
      - Use valid calendar dates, strictly descending numeric SemVer versions, and non-increasing dates.
      - Give every entry nonempty level-three subsections from Added, Changed, Fixed, Breaking changes, Migration, or Security.
    donts:
      - Do not duplicate versions or use malformed, empty, unsupported, or out-of-order sections.
    examples:
      - "# Release Notes\n\n## Unreleased\n\n### Changed\n\nPending change.\n\n## 12.0.0 — 2026-06-01\n\n### Added\n\nInitial release."
