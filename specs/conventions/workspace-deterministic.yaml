version: "13.0"
description: Lists deterministic rules for Eliware workspace repositories.
requires:
  - general
  - private
conflicts:
  - application
  - database
  - cli
  - web
  - discord
  - mcp-server
  - library
  - documentation
  - infrastructure
  - npm-published
  - ghcr-published
directives:
  - id: E-0.1.2.1.0
    dos:
      - Add a Workspace section to AGENTS.md.
      - Add Runbooks, Communication, and Recovery sections to README.md.
      - Keep a navigation-only runbooks/README.md index.
      - Store each runbook as a separate .yaml file under runbooks/.
      - Link every runbook from runbooks/README.md.
      - Validate each runbook against the bundled runbook schema.
    donts:
      - Do not omit workspace-specific headings.
    examples:
      - "## Workspace"
      - "## Runbooks


        ## Communication


        ## Recovery"
