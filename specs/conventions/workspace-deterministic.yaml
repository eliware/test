version: "15.0"
description: Lists deterministic rules for Eliware workspace repositories.
directives:
  - id: E-0.1.2.1.0
    dos:
      - Add a Workspace section to AGENTS.md.
      - Add Runbooks, Communication, and Recovery sections to README.md.
      - Keep a navigation-only runbooks/README.md index.
      - Store each runbook in its own .yaml file in runbooks/.
      - Link each runbook from runbooks/README.md.
      - Validate each runbook against the bundled runbook schema.
    donts:
      - Do not omit workspace-specific headings.
    examples:
      - /eliware/workspace-template/AGENTS.md
      - /eliware/workspace-template/README.md
      - /eliware/workspace-template/runbooks/README.md
      - /eliware/workspace-template/runbooks/deploy-component.yaml
