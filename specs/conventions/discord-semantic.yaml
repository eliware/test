version: "12.0"
description: Lists semantic rules for Eliware Discord applications.
requires:
  - application
directives:
  - id: E-0.1.7.0.0
    dos:
      - Document commands, events, intents, permissions, runtime settings, and lifecycle accurately.
      - Request only permissions and intents needed by supported behavior.
      - Explain safe startup, shutdown, deployment boundaries, and effects on users and servers.
    donts:
      - Do not expose bot credentials or imply unavailable permissions.
      - Do not provide instructions that unintentionally connect or expose a live bot.
