version: "13.0"
description: Lists semantic rules for Eliware Discord applications.
requires:
  - general
  - application
conflicts:
  - library
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.7.0.0
    dos:
      - Document each command and event from its handler, JSON definition, and tests.
      - Request only intents and permissions used by documented command and event behavior.
      - Describe each command and event purpose and visible result from handler code and
        tests.
      - Compare localized message meaning across locale files and the en-US.json source.
      - Use placeholder bot credentials and name a test bot and test server in each
        copyable connection command.
      - Mark each command that connects a live bot or exposes a live bot.
      - Name the live target and required authorization in each live-service instruction.
    donts:
      - Do not expose bot credentials or imply unavailable permissions.
      - Do not present a live bot or server as a test target.
      - Do not provide a live-service command without a live target label and authorization
        step.
