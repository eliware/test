version: "13.0"
description: Defines deterministic requirements shared by Eliware repositories.
directives:
  - id: E-0.1.0.1.0
    dos:
      - Set id to the assigned repository E-number.
      - Allow ../docs/repo-map.yaml to be missing.
      - When ../docs/repo-map.yaml lists this repository, match package.json eliware.id,
        description, keywords, and applied profiles.
      - Match package exemptions to repository map exemptions.
      - Use an empty map list when the repository record omits exemptions.
      - Use an empty package list when package metadata omits exemptions.
      - Ignore object key order when exemption records match.
      - Validate ../docs/repo-map.yaml with ../docs/repo-map-schema.yaml when that file exists.
      - When no repository entry exists, validate package metadata through the general
        package rules.
      - Give exemptions unique known check IDs, nonempty reasons, approver Eli, valid
        approvalTimestamp, and valid expiry or null.
      - Allow an optional unique paths array of repository-relative paths in each exemption.
      - Match a path exactly when it has no wildcard.
      - Let * match in one path segment.
      - Let ** match zero or more path segments.
      - Apply each path exemption only to its named rule.
      - Apply path exemptions to checks that read the Git index.
      - Skip the rule and child checks when paths are omitted or empty.
      - Skip listed paths only in the named rule's check.
    examples:
      - '{"id":"E-38","apply":["general"],"exempt":[]}'
    donts:
      - Do not add unknown eliware keys.
      - Do not accept expired or malformed exemptions.
      - Do not use AGENTS.md to supply exemption metadata.
      - Do not require a repository entry in ../docs/repo-map.yaml.
      - Do not use repository map data that fails schema validation.

  - id: E-0.1.0.1.1
    dos:
      - Keep package.json, package-lock.json, README.md, AGENTS.md, LICENSE, and
        specs/README.md.
      - Define a scoped @eliware name, nonempty description, no more than 20 unique
        nonempty keywords, and boolean private.
      - Require Node.js 26 or newer with package.json.engines.node set to ">=26".
      - Use the canonical author, repository, homepage, license, module type, and Node.js
        metadata shown in the example.
      - Set package.json.bugs.url to the matching GitHub repository issues URL.
      - Use numeric `MAJOR.MINOR.PATCH` matching the applied convention version.
      - Match lockfile metadata and dependency references to package.json.
      - Keep each Node.js dependency at its latest available release. The outdated stage
        must report no newer release.
      - Use the MIT license text with Copyright (c) 2026 Eliware.
    donts:
      - Do not use prerelease or build suffixes, alternative identity metadata, or
        malformed dependency maps.
      - Do not use CommonJS module syntax in maintained implementation.
    examples:
      - >-
        {"name":"@eliware/example","version":"13.0.0","type":"module",
        "description":"Example repository","keywords":["example"],"private":true,
        "publishConfig":{},"main":"src/index.mjs","bin":"bin/example.mjs","files":["src/"],
        "scripts":{},"engines":{"node":">=26"},"dependencies":{},"devDependencies":{},
        "jest":{},"prettier":{},"author":"Eliware <eliware@eliware.org>","license":"MIT",
        "repository":{"type":"git","url":"git+https://github.com/eliware/example.git"},
        "homepage":"https://github.com/eliware/example#readme",
        "bugs":{"url":"https://github.com/eliware/example/issues"},
        "eliware":{"id":"E-1234","apply":["general"]}}

  - id: E-0.1.0.1.2
    dos:
      - Start AGENTS.md with the exact title shown in the example.
      - Include all required headings shown in the example.
      - Include the literal markers Node.js 26 and native ESM and all required shared
        validation command.
    donts:
      - Do not omit or rename a required heading.
      - Do not create README.md in .knit/.
    examples:
      - "# AGENTS.md


        ## Project


        ## Scope and boundaries


        ## Layout


        ## Development


        ## Validation


        ## Security


        ## Changes"
      - "The base headings appear in the required order."

  - id: E-0.1.0.1.3
    dos:
      - Use the README header and footer order in ordering/readme-sections.yaml.
      - Use the canonical README header order in ordering/readme-sections.yaml.
      - Use the exact package.json.name for title text. Format it with `##
        @eliware/<repo-name>` followed by badges on the same line.
      - Use the npm, License, and CI badges in that order. Include npm only when
        package.json.eliware.apply includes npm-published.
      - Use the exact brand image, badge targets, and title markers shown in the examples.
      - Include all sections resolved from package.json.eliware.apply and
        ordering/readme-sections.yaml.
      - "Use these exact general headings: `Features`, `Requirements`, `Setup`, `Usage`,
        `Development`, `Testing`, `Troubleshooting`, and `Security`."
      - Include Support, Links, and License sections.
      - Use one instance of each general level-two heading.
      - Link each required content section in canonical order in the Table of
        Contents.
      - Use lowercase space-to-hyphen fragments for Table of Contents links.
      - Put local documentation and specifications navigation in a content heading, not
        in the header or footer.
      - Include the exact package description in the header.
      - Link specs/README.md from a content section.
      - Use the exact License section and link text shown in the examples.
      - Use the exact Support text shown in the examples.
      - Use Links labels and targets from ordering/readme-sections.yaml.
      - Include npm in Links only when package.json.eliware.apply includes npm-published.
      - Keep the Links section to canonical links in order.
      - Do not link to the private Eliware Docs repository.
    donts:
      - Do not include the title or Table of Contents in its own section list.
      - Do not add unlisted level-two sections.
      - Do not change the package name text or add header navigation.
      - Do not use `.git` or git+https URLs in the GitHub Repo link.
    examples:
      - "#
        [![eliware.org](https://eliware.org/logos/brand.png)](https://discord.gg/M6aTR9eT\
        wN)"
      - "## @eliware/<repo-name>
        [![npm](https://img.shields.io/npm/v/@eliware/<repo-name>)](https://www.npmjs.com\
        /package/@eliware/<repo-name>)
        [![License](https://img.shields.io/github/license/eliware/<repo-name>)](https://g\
        ithub.com/eliware/<repo-name>/blob/main/LICENSE)
        [![CI](https://github.com/eliware/<repo-name>/actions/workflows/ci.yaml/badge.svg\
        )](https://github.com/eliware/<repo-name>/actions/workflows/ci.yaml)"
      - "For a repository without public npm publication, omit the npm badge and keep
        License before CI."
      - "The next header line is the exact non-empty package.json description."
      - "## Table of Contents"
      - "## Support


        For help, questions, or to chat with the author and community, visit:


        [![Discord](https://eliware.org/logos/discord_96.png)](https://discord.gg/M6aTR9e\
        TwN)[![eliware.org](https://eliware.org/logos/eliware_96.png)](https://discord.gg\
        /M6aTR9eTwN)


        **[eliware.org on Discord](https://discord.gg/M6aTR9eTwN)**"
      - "[![License](https://img.shields.io/github/license/eliware/example)](https://gith\
        ub.com/eliware/example/blob/main/LICENSE)"
      - "[![CI](https://github.com/eliware/example/actions/workflows/ci.yaml/badge.svg)](\
        https://github.com/eliware/example/actions/workflows/ci.yaml)"
      - "- [Home Page](https://eliware.org)

        - [GitHub Org](https://github.com/eliware)

        - [GitHub Repo](https://github.com/eliware/<repo-name>)

        - [Bug Reports](https://github.com/eliware/<repo-name>/issues)

        - [npm](https://www.npmjs.com/package/@eliware/<repo-name>)

        - [Discord](https://discord.gg/M6aTR9eTwN)"
      - "[MIT © Eliware](LICENSE)"

  - id: E-0.1.0.1.4
    dos:
      - Make each local Markdown link to repository content resolve in the checkout.
      - Make local Markdown fragments resolve to headings or explicit HTML IDs.
      - Give HTTP and HTTPS links hostnames without embedded credentials and mailto links
        email addresses.
      - Use full HTTPS GitHub URLs for cross-repository links.
      - Keep specs/directives.yaml.
      - Parse all YAML files in specs/ and its nested directories.
      - Limit each parsed YAML file to 100000 UTF-8 bytes and 1000
        lines.
      - Limit each YAML line to 100 characters, not counting line endings.
      - Limit each YAML document to 100 aliases.
      - Set the YAML parser alias limit explicitly.
      - Report the file path, observed value, and required limit when a YAML limit fails.
      - Validate only YAML documents with a top-level directives key against the bundled
        directives schema.
      - Give each specs directory a navigation-only README.md with links to its same-folder
        YAML files.
      - Index all specifications.
      - Allow only YAML documents, README.md indexes, and conforming subdirectories in
        specs/.
      - Use unique E-rule IDs in the assigned repository namespace.
      - Number siblings sequentially from 0 in their document prefix and append
        sequential child numbers to actual parent IDs.
    donts:
      - Do not set a second memory cap for YAML parsing.
      - Do not use escaping relative links, A-rule IDs, duplicate IDs, or invalid child
        ancestry.
      - Do not duplicate nested inventories in parent indexes.
    examples:
      - "An E-38 document prefix may contain E-38.0 with children E-38.0.0 and E-38.0.1."

  - id: E-0.1.0.1.5
    dos:
      - For consumer repositories, use the five shared scripts from the examples.
      - Run lint and format-check during aggregate validation.
      - Give other scripts nonempty commands.
      - Pass lint with zero errors and warnings.
      - Keep .mjs, .json, .yml, .yaml, and .md files valid and formatted to match examples.
      - Match package.json.prettier to its example.
      - Use package.json.prettier for all formatting settings.
    donts:
      - Do not replace shared scripts with checks that omit required stages.
      - For consumer repositories, do not directly declare or import Oxlint or Prettier or
        invoke them in validation commands.
      - Do not exclude maintained files of the required types from formatting.
      - Do not add standalone Prettier configuration or a .prettierignore file.
      - Do not add publication commands to package scripts.
      - Do not create or upload GitHub releases from package scripts.
    examples:
      - '{"test":"eliware-test","lint":"eliware-test --lint","audit":"eliware-test
        --audit","format":"eliware-test --format","format:check":"eliware-test
        --format-check"}'
      - >-
        {"printWidth":100,"tabWidth":2,"useTabs":false,"semi":true,"singleQuote":false,
        "quoteProps":"as-needed","jsxSingleQuote":false,"trailingComma":"all",
        "bracketSpacing":true,"bracketSameLine":false,"arrowParens":"always",
        "proseWrap":"preserve","endOfLine":"lf"}

  - id: E-0.1.0.1.6
    dos:
      - "Keep exactly one YAML file in .knit/: .knit/deploy.yaml."
      - If a push or tag deployment list is set, use an array.
      - Set timeoutMs to 300000 for each deployment in a push or tag deployments array.
      - Keep the deployment path repository-specific.
      - "Start each commands array with this exact sequence: `git pull`,
        `npm ci`, `npm test`."
      - Add commands after this prefix only when they do not publish an npm package or a
        GHCR image.
      - Keep secondary Knit scripts in .knit/.
      - Use the .mjs extension for secondary Knit scripts.
    donts:
      - Do not change, omit, or reorder commands in the required prefix.
      - Do not include npm publication or explicit GHCR image-publication commands.
      - Do not use secondary Knit scripts with extensions other than .mjs.
    examples:
      - "commands:

        \  - git pull

        \  - npm ci

        \  - npm test"
      - "on:

        \  tags:

        \    \"v*\":

        \      deployments:

        \        - timeoutMs: 300000

        \          commands:

        \            - git pull

        \            - npm ci

        \            - npm test"

  - id: E-0.1.0.1.7
    dos:
      - Keep one ci.yaml document in .github/workflows/.
      - Enable push and `pull_request` events for main.
      - Set repository-and-ref concurrency with cancel-in-progress true.
      - Set workflow and validation-job permissions to contents read only.
      - Run validation unconditionally on Ubuntu using checkout major v7 and setup-node
        major v7 with Node.js 26.
      - "Set checkout fetch-depth to 0 before validation."
      - Install npm@latest before npm ci.
      - Run one standalone npm ci step, then one standalone npm test step.
      - Add workflow steps after npm test only when they do not publish npm or GHCR packages.
      - Keep ci.yaml for validation.
      - Allow publish.yaml when npm-published or ghcr-published applies.
      - Before `npm ci`, allow approved setup actions and npm latest installation.
      - Allow `echo` or `printf` only when commands report literal text.
      - Allow shell operators as text only inside quoted arguments.
      - Use single quotes for literal dollar signs and double quotes without expansion.
      - Do not set environment, shell, or working-directory overrides on required install
        and test steps.
      - Accept inline lists and indented YAML lists with matching values.
    donts:
      - Do not add GitHub Actions workflow files other than ci.yaml and a required
        publish.yaml.
      - Do not make required validation steps conditional.
      - Do not use continue-on-error for required validation steps.
      - Do not override checkout repository or ref.
      - Do not use pre-install reporting with expansion, redirects, control operators,
        backslashes, or embedded line breaks.
      - Do not publish npm packages or GHCR images in validation jobs.
    examples:
      - "name: Validation

        on:

        \  push:

        \    branches: [main]

        \  pull_request:

        \    branches: [main]

        concurrency:

        \  group: ${{ github.repository }}-${{ github.ref }}

        \  cancel-in-progress: true

        permissions:

        \  contents: read

        jobs:

        \  test:

        \    runs-on: ubuntu-latest

        \    permissions:

        \      contents: read

        \    steps:

        \      - uses: actions/checkout@v7

        \        with:

        \          fetch-depth: 0

        \      - uses: actions/setup-node@v7

        \        with:

        \          node-version: 26

        \          cache: npm

        \      - run: npm -g install npm@latest

        \      - run: npm ci

        \      - run: npm test"

  - id: E-0.1.0.1.8
    dos:
      - Ignore directories named node_modules, .git, coverage, dist, build, generated,
        artifacts, and test-results at all depths.
      - Ignore .DS_Store and Thumbs.db.
      - Keep tracked and staged files unignored by the root .gitignore.
      - Do not include symlinks in tracked paths.
      - Allow only .env.example in tracked environment files.
      - Reject tracked .env and .env.<name> files. Allow .env.example.
      - Reject paths with a component named id_rsa, secret, secrets, credential,
        credentials, token, or tokens.
      - Reject files with .pem, .key, .p12, or .pfx extensions.
      - Use only the root .gitignore.
      - Do not add nested .gitignore files.
    donts:
      - Do not add ignored files or symlinks to the Git index.
      - Do not ignore package.json.

  - id: E-0.1.0.1.9
    dos:
      - Scan maintained repository text files for machine-specific absolute paths.
      - 'Reject Windows paths rooted at Users, home, srv, or var\lib directories.'
      - Allow paths rooted at /home/node, /home/argocd, or /home/runner. Reject other
        paths rooted at /home.
      - Reject POSIX paths rooted at /users.
      - Allow paths rooted at /srv/repository or /srv/workspace. Reject other /srv paths.
      - "Reject C: or D: paths rooted at eliware or Users/<name>/src."
      - Skip invalid UTF-8 and binary files.
      - Fail validation when repository files cannot be listed or read.
    donts:
      - Do not scan for labels, hostnames, or file URLs.
      - Do not reject POSIX paths rooted at /var/lib.

  - id: E-0.1.0.1.10
    dos:
      - Scan all .mjs files in src/. Check each folder at each depth.
      - Ignore the prefix E because it identifies rule files.
      - Find the prefix shared by the most file names in each folder.
      - When prefixes match the same number of file names, select the longest prefix.
      - Move matching files into a folder named for the full prefix without its final
        hyphen.
      - Remove the moved prefix and hyphen from each file name.
      - Keep multiword prefixes, for example create-repository, in one folder name.
      - Store main modules and submodule folders at the same directory level.
      - Remove the parent folder name and hyphen from each child file name.
      - Apply each source move to its matching test file in tests/.
      - Scan again until no folder has a shared prefix.
    donts:
      - Do not use the parent folder name in a child file name.
      - Do not infer file relationships from code content.

  - id: E-0.1.0.1.11
    dos:
      - Limit each instruction in a directive document's dos or donts field to 20 words.
      - Limit each other human-readable prose sentence to 25 words.
      - Count one word for each hyphenated compound.
      - Split sentences at terminal punctuation followed by whitespace or a file boundary.
      - Use periods, question marks, and exclamation marks to mark sentence ends.
      - Limit each prose paragraph to six sentences.
      - Check human-readable JavaScript comments, strings, and JSX text.
      - "Check Markdown, plain-text, YAML, JSON, JavaScript, and JSX files with these
        extensions: `.md`, `.txt`, `.yaml`, `.yml`, `.json`, `.mjs`, `.js`, and `.jsx`."
      - Do not check other file extensions.
      - "Check these JSON prose fields: `description`, `title`, `purpose`, `owner`,
        `boundaries`, `prerequisites`, `steps`, `prompt`, `message`, `help`, `summary`,
        `note`, `notes`, and `content`."
      - Ignore examples subtrees and all other JSON keys.
      - Check directive items, descriptive fields, and runbook text in YAML documents.
      - Exclude code blocks, code spans, and link destinations from word counts.
      - Match dictionary entries in uppercase or lowercase, at whole-word or exact-phrase
        boundaries.
      - Do not match a dictionary term in a hyphenated compound.
      - Show each match, its file, line, and suggested alternatives.
      - Tell writers that alternatives are examples, not requirements.
      - Tell writers to rewrite each sentence without the listed term.
      - Load unapproved.csv from the installed eliware-test package.
      - Ignore code, commands, identifiers, URLs, examples, and the dictionary itself.
      - Ignore exact sentences from bundled convention examples.
    donts:
      - Do not parse malformed YAML or JSON in this check.
      - Do not derive word meanings or grammar labels from context.
      - Do not accept a dictionary term because its spelling appears in an alternative.
      - Do not use semicolons in human-readable prose.
