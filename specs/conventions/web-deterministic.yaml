version: "13.0"
description: Lists deterministic rules for Eliware web applications.
directives:
  - id: E-0.1.6.1.0
    dos:
      - Add a Web section to AGENTS.md.
      - Add Routes, Assets, Development server, Build, and Deployment sections to
        README.md.
    donts:
      - Do not omit web-specific headings.
    examples:
      - /eliware/web-template/AGENTS.md
      - /eliware/web-template/README.md

  - id: E-0.1.6.1.1
    dos:
      - Use <repo-root>/public for the web asset inventory root.
      - Keep dist, build, coverage, node_modules, and .git directories out of public/ at
        each depth.
    donts:
      - Do not set package.json.eliware.webRoot or package.json.eliware.webAssetExcludes.
      - Do not automatically run prebuild or postbuild scripts during aggregate validation.
    examples:
      - /eliware/web-template/public/index.html
      - /eliware/web-template/dist/client.js

  - id: E-0.1.6.1.2
    dos:
      - Declare webpack and webpack-cli as direct package dependencies.
      - Keep webpack.config.mjs at the repository root.
      - Set scripts.build to `webpack --config webpack.config.mjs`.
      - Export one default configuration object from webpack.config.mjs.
      - Set context to the repository root.
      - Set mode to production and target to web.
      - Define one or more named bundles in the entry object.
      - Set output.path to <repo-root>/dist.
      - Set output.filename to `[name].js` and output.clean to true.
      - Add project-specific loaders, rules, plugins, and other options when needed.
      - Run build during aggregate validation.
      - Set lighthouse and puppeteer in dependencies.
      - Define nonempty lighthouse and screenshots scripts.
    donts:
      - Do not change the required Webpack config values.
      - Do not add commands or shell operations to scripts.build.
      - Do not duplicate build in CI.
      - Do not run lighthouse or screenshots during validation.
    examples:
      - /eliware/web-template/package.json
      - /eliware/web-template/webpack.config.mjs
