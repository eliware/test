version: "12.0"
description: Lists deterministic rules for Eliware web applications.
requires:
  - general
  - application
conflicts:
  - library
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.6.1.0
    dos:
      - Add a Web section to AGENTS.md.
      - Add Routes, Assets, Development server, Build, and Deployment sections to README.md.
    donts:
      - Do not omit web-specific headings.
    examples:
      - "## Web"
      - "## Configuration\n\n## Routes\n\n## Assets\n\n## Development server\n\n## Build\n\n## Deployment"

  - id: E-0.1.6.1.1
    dos:
      - Use <repo-root>/public as the web asset inventory root.
      - Keep dist, build, coverage, node_modules, and .git directories out of public/ at every depth.
    donts:
      - Do not set package.json.eliware.webRoot or package.json.eliware.webAssetExcludes.
      - Do not automatically run lighthouse, puppeteer, prebuild, or postbuild scripts during aggregate validation.
    examples:
      - "<repo-root>/public"
      - "<repo-root>/dist"

  - id: E-0.1.6.1.2
    dos:
      - Define build as one command that invokes a directly declared build tool.
      - Run build during aggregate validation.
      - Set lighthouse and puppeteer as direct dependencies.
      - Define nonempty lighthouse and puppeteer scripts.
    donts:
      - Do not chain or redirect build or duplicate it in CI.
