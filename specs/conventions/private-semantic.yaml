version: "13.0"
description: Lists semantic rules for private Eliware publication.
requires:
  - general
conflicts:
  - npm-published
directives:
  - id: E-0.1.12.0.0
    dos:
      - Document approved audiences, access boundaries, publication channels, and
        publication limits from repository and package access settings.
      - Distinguish source-hosting visibility, npm publishability, and container
        visibility.
      - Compare visibility claims with repository access settings, package settings, and
        publication workflows.
    donts:
      - Do not use the label public access for private publication with access limits.
      - Do not let container publication give permission to publish npm packages or deploy.
