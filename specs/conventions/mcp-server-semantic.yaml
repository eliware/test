version: "12.0"
description: Lists semantic rules for Eliware MCP server applications.
requires:
  - general
  - application
conflicts:
  - library
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.8.0.0
    dos:
      - Document tools, resources, prompts, transports, authentication, schemas, and protocol behavior accurately.
      - Explain network exposure, access boundaries, and protocol validation.
      - State unsupported capabilities.
      - Explain each tool's purpose, input schema, response, and side effects accurately.
      - Explain the behavior of each supported resource, prompt, and transport accurately.
    donts:
      - Do not expose credentials or claim unsupported protocol guarantees.
      - Do not provide instructions that unintentionally expose a live endpoint.
