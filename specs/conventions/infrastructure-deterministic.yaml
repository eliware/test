  - application
  - cli
  - web
  - discord
  - mcp-server
  - library
  - documentation
  - workspace
  - npm-published
  - ghcr-published
directives:
  - id: E-0.1.9.1.0
    dos:
      - Add an Infrastructure section to AGENTS.md.
      - Add Managed targets, Configuration, Desired state, Validation, and Change boundaries sections to README.md.
