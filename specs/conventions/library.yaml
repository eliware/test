version: "11.0"
description: Applies to repositories containing library code.
requires: []
directives:
  - id: E-0.1.40
    dos:
      - These conventions apply to repositories containing library code.
    donts:
      - Library repositories must not omit applicable library requirements.
    directives:
      - id: A-0.1.40.0
        dos:
          - Every library repository must extend the general AGENTS.md requirements with applicable library guidance.
        donts:
          - A library repository must not omit AGENTS.md.
        directives:
          - id: A-0.1.40.0.1
            dos:
              - "After the seven general AGENTS.md headings, add a ## Library section. Document public API boundaries, exports and declarations, compatibility policy, package contents/allowlist, package validation, typecheck, and consumer-validation commands."
            donts:
              - AGENTS.md must not leave the public library contract or package validation undefined.
      - id: A-0.1.40.1
        dos:
          - Libraries must define explicit exports and declarations for typed public APIs, test the public API, use package allowlists, and provide .env.example when the library supports environment configuration.
          - Every library must contain examples/README.md and at least one runnable native-ESM .mjs or .js example under examples/; CommonJS .cjs files are not runnable examples.
          - Every library must contain docs/ with end-user documentation and docs/README.md as its overview and index. The index must link every discovered end-user document other than docs/README.md itself, which is the index. During change review, a human or AI reviewer must assess whether the documentation set covers supported user-facing workflows and record relevant findings with the change.
          - Public Eliware packages must use the @eliware scope, repository metadata matching package.json, an approved license, the Eliware Discord, GitHub, and eliware@eliware.org support channels, and synchronized public branding.
        donts:
          - Libraries must not omit the examples index or runnable example, publish unintended files, or leave the public package contract untested.
        directives:
          - id: A-0.1.40.1.0
            dos:
              - The repository owner determines whether the library supports environment configuration from its documented runtime behavior. If it does, .env.example must exist and list every supported variable. Keep required variables active and comment out optional variables with their defaults and available options. Configure MAIL_OWNER_ADDRESS only through an untracked, gitignored .env file and omit it from templates.
              - Human or AI review during change review must confirm the supported-variable inventory, required/optional classification, defaults, and available options. Record the review findings with the change. Deterministic validation may reject prohibited entries such as MAIL_OWNER_ADDRESS but cannot prove that the template is complete or semantically correct.
            donts:
              - Do not omit supported environment variables, leave optional variables active, or include MAIL_OWNER_ADDRESS in .env.example.
      - id: A-0.1.40.3
        dos:
          - Under the API, Packaging, and Examples headings assigned to library by general.yaml, document installation, public exports, compatibility, package validation, and at least one runnable usage example. Include the headings in the Table of Contents as required by general.yaml.
          - Library README.md must link docs/README.md and examples/README.md when those surfaces are required, and every runnable example must state prerequisites, command, and expected result.
        donts:
          - Do not document private implementation details as public API, publish undocumented examples, or imply compatibility that the package does not test.
      - id: A-0.1.40.5
        dos:
          - Library package.json must declare public runtime entrypoints under src/ (for example, ./src/index.mjs), type declaration targets under src/ when TypeScript declarations are provided (for example, ./src/index.d.ts), and an intentional package file allowlist. Point main, exports, types, and typings metadata at those paths; declarations are optional when the library does not support TypeScript.
          - A library is permitted to provide examples beyond its mandatory example contract.
        donts:
          - Do not put library runtime entrypoints or TypeScript declarations at the package root or outside src/, or publish a library with undefined exports or package contents.
      - id: E-0.1.40.2
        dos:
          - Published libraries must validate the package contents and allowlist before publication.
        donts:
          - Published libraries must not publish files outside the intentional package contents.
      - id: E-0.1.40.4
        dos:
          - Published libraries must run package dry-run validation and verify the resulting file allowlist before publication.
        donts:
          - Do not publish a library without validating its packed contents.
      - id: E-0.1.40.6
        dos:
          - Libraries must define a non-empty typecheck script using the repository's direct typechecker as one command, without shell chaining or redirection. Aggregate `npm test` must run `npm run typecheck` automatically, and typecheck must pass before release consideration.
        donts:
          - Do not omit typecheck from aggregate `npm test`, require a separate typecheck step in CI, or release a library without passing typecheck.
      - id: E-0.1.40.7
        dos:
          - Libraries must keep executable implementation source under src/ and mirror that structure under tests/ with exactly one corresponding .test.mjs file for every .mjs source file, including source files excluded from coverage. Every test file under tests/ must correspond to a source file under src/; additional unmirrored integration, end-to-end, smoke, or cross-cutting test files are not allowed.
          - The source/test mirror check must inventory all source and test files. A .d.ts declaration is permitted only beside a same-basename .mjs file under src/; count the declaration and implementation together as one mirror unit, and validate the declaration through the required typecheck script rather than requiring a second test for the metadata file.
          - Each mirrored test must parse as JavaScript, contain an executable Jest test or it declaration with a callback, and reference its exact matching source module. Static imports and re-exports, literal dynamic imports, require calls, and supported Jest mock calls count as source references; comments, strings, unrelated imports, describe-only declarations, skipped tests, and todo declarations do not satisfy this requirement.
          - Place checked-in fixtures, snapshots, generators, and shared test support with no source counterpart in the repository-root test-fixtures/ directory. Reserve artifacts/ for generated, untracked test output such as Puppeteer screenshots and traces; ignore that directory and do not store checked-in helpers or fixtures there.
        donts:
          - Do not omit src/ or tests/, use mismatched source/test paths, use non-.test.mjs test counterparts, treat coverage exclusions as waivers of the mirror requirement, or duplicate lower-level assertions in higher-level tests.
          - Do not place generated, bundled, compiled, dependency, coverage, or build output in source/test architecture.
      - id: E-0.1.40.8
        dos:
          - Libraries must test applicable implementation code without Istanbul coverage-ignore directives; the exact pure export barrel declared as a public package entrypoint is the sole barrel exception.
        donts:
          - Do not hide uncovered production behavior with Istanbul coverage-ignore directives unless the file is the pure export barrel declared as a public package entrypoint.
      - id: E-0.1.40.9
        dos:
          - Place unit tests at the lowest module level that directly proves behavior; keep only cross-cutting and integration tests in higher-level orchestrator test directories.
        donts:
          - Do not duplicate lower-level assertions in higher-level tests.
      - id: E-0.1.40.10
        dos:
          - Remove superseded compatibility branches, legacy aliases, and fallback behavior when the current contract replaces them.
        donts:
          - Do not preserve obsolete contracts for consumer convenience.
      - id: E-0.1.40.11
        dos:
          - Library production modules are subject to the single-responsibility rule in general.yaml E-0.1.27. When a change introduces a distinct library responsibility, create a focused submodule and its mirrored test, then wire it through the existing owner or coordinator.
        donts:
          - Do not treat library-profile compliance as a waiver from general.yaml E-0.1.27.
      - id: E-0.1.40.12
        dos:
          - Enforce a maximum of 100 physical lines for each in-scope library source file and 200 physical lines for each in-scope test file. Count blank and comment lines; count an unterminated final line as one line and an empty file as zero. Exclude files under any path segment named .git, build, coverage, dist, generated, node_modules, test-fixtures, fixtures, __fixtures__, or __snapshots__, and exclude filenames ending in .d.mts or .snap.mjs or containing .generated. These exclusions apply only to physical line counting; they do not exempt .mjs files under src/ or tests/ from source/test mirroring and do not change syntax, lint, formatting, coverage, or other check inventories. Count handwritten data tables and static mappings as ordinary physical lines; the stated path/filename exclusions apply regardless of file contents. Apply the same counting and exclusion contract to source and test files. Exceeding either maximum is a blocking convention failure and requires decomposition into focused modules with mirrored tests.
          - "Apply the single-responsibility requirement independently at every file size: being within the line maximum does not prove cohesion or permit distinct responsibilities to share a module, and a mixed-responsibility module must be split even when it is below the maximum."
          - Aggregate line counting must read file contents through the shared repository inventory so checks reuse cached content rather than repeatedly reading each file from disk. When inventory access is unavailable, discover nested source and test files iteratively so directory depth cannot exhaust the JavaScript call stack.
        donts:
          - Do not treat compliance with a line maximum as permission to mix responsibilities, or reduce line count superficially without creating focused modules and mirrored tests.
      - id: E-0.1.40.13
        dos:
          - Library repositories are subject to the shared package-reuse review in general.yaml E-0.1.27 and its example mapping. Human review must determine whether library production code owns a mapped concern; deterministic validation must not report that review as passed.
        donts:
          - Do not report the shared package-reuse review as deterministically passed.
      - id: E-0.1.40.14
        dos:
          - Allow pure export barrels only as a library's primary public entrypoint or index.
        donts:
          - Do not create pure barrel files for internal modules or unrelated convenience re-exports.
      - id: E-0.1.40.15
        dos:
          - Jest is the required test runner for this profile. Run its suites through eliware-test; test files may import APIs from @jest/globals supplied transitively. Alternative test runners do not satisfy this profile.
        donts:
          - Do not invoke Jest directly, import Jest runner/CLI modules, or declare Jest packages directly.
      - id: E-0.1.40.16
        dos:
          - Library Jest coverage must use Istanbul and report 100% statements, branches, functions, and lines with zero uncovered lines for in-scope production code; coverage scope is limited to native ESM .mjs production files under src/. Jest and Istanbul are the required profile tools; alternate test runners or coverage engines do not satisfy this profile.
          - Exclude generated, bundled, compiled, dependency, coverage, build, declaration, fixture, and snapshot files from in-scope code; the primary public export barrel may be excluded.
        donts:
          - Do not hide untested production logic with coverage exclusions.
      - id: E-0.1.40.17
        dos:
          - Keep library test execution quiet unless output is under test or an intentional failure diagnostic.
        donts:
          - Do not allow incidental logs, console output, debug traces, or process output to leak from normal test runs.
      - id: E-0.1.40.18
        dos:
          - Library entrypoints must be thin and delegate unrelated implementation logic to focused modules.
        donts:
          - Do not place unrelated implementation logic in a library entrypoint.
      - id: E-0.1.40.19
        dos:
          - Use dependency injection to keep library modules independently testable.
        donts:
          - Do not hard-code replaceable external dependencies when dependency injection can keep a library module testable.
