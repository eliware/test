version: "13.0"
description: Lists deterministic rules for Eliware command-line applications.
directives:
  - id: E-0.1.5.1.0
    dos:
      - Add a CLI section to AGENTS.md.
      - Add an Exit codes section to README.md.
      - Require package.json.bin to declare each public CLI executable.
      - Give each declared public executable --help and --version.
      - Make --help return nonempty output and exit code 0.
      - Make --version report package.json.version and exit code 0.
    donts:
      - Do not report a different version.
      - Do not omit informational options.
    examples:
      - /eliware/cli-template/AGENTS.md
      - /eliware/cli-template/README.md
      - /eliware/cli-template/bin/eliware-cli-template.mjs
      - /eliware/cli-template/tests/cli.test.mjs
