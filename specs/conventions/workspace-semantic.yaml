version: "13.0"
description: Lists semantic rules for Eliware workspace repositories.
requires:
  - general
  - private
conflicts:
  - application
  - database
  - cli
  - web
  - discord
  - mcp-server
  - library
  - documentation
  - infrastructure
  - npm-published
  - ghcr-published
directives:
  - id: E-0.1.2.0.0
    dos:
      - Describe each workspace purpose, owner, role boundary, contact path, escalation path,
        and recovery responsibility in its indexed documentation.
      - Give each runbook a purpose, owner, scope boundary, prerequisites, ordered actions,
        and an observable result for each action.
      - When a runbook requires prerequisites, list each one.
      - Verify each action against its observable result.
      - If a result falls outside the runbook, stop and contact Eli.
      - A live system serves users or stores operational data.
      - For a procedure that can change a live system, state the permitted actions and
        required approval.
      - For a procedure that can change a live system, document recovery steps and an
        escalation path.
      - Require Eli's approval before an agent starts a rollback.
      - Write runbook instructions with the shared language rules.
      - Include all facts and decisions required to follow a runbook in the runbook or its
        linked authoritative procedures.
      - Link to each DBA or Operations procedure that a runbook uses.
      - Keep durable workspace decisions in indexed specifications.
      - Compare runbook steps and results with linked procedures and role boundaries in
        workspace specifications.
    donts:
      - Do not claim authority that the assigned scope does not grant.
      - Do not let recovery guidance authorize an agent to make changes.
      - Do not maintain a competing company-wide task tracker.
      - Do not require private messages or prior conversation to follow a runbook.
