version: "13.0"
description: Defines deterministic repository requirements for Eliware GHCR publication.
directives:
  - id: E-0.1.11.1.0
    dos:
      - Add a GHCR publication section to AGENTS.md.
      - Include the exact Usage markers shown with package-derived image identity and
        version.
      - Use only version tags because the canonical workflow does not publish latest.
    donts:
      - Do not use stale identity markers.
      - Do not list latest as a supported tag.
    examples:
      - "## GHCR publication"
      - "Image: ghcr.io/eliware/example"
      - "Pull command: docker pull ghcr.io/eliware/example:v13.0.0"
      - "Supported tags: vMAJOR.MINOR.PATCH"
      - "Deployment boundary: publication does not deploy; deploy by immutable version tag
        and recorded sha256 digest."

  - id: E-0.1.11.1.1
    dos:
      - Keep the Dockerfile at the repository root.
      - Use .github/workflows/ghcr.yaml for GHCR publication.
      - Match the file byte for byte with specs/workflows/ghcr.yaml.
      - Include line endings and the final newline in each match.
    donts:
      - Do not use .github/workflows/publish.yaml for GHCR publication.
    examples:
      - "The canonical workflow is specs/workflows/ghcr.yaml."
