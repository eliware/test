version: "12.0"
description: Defines deterministic repository requirements for Eliware GHCR publication.
requires: []
directives:
  - id: E-0.1.11.1.0
    dos:
      - Add GHCR publication to AGENTS.md at the canonical profile position.
      - Include the exact Usage markers shown with package-derived image identity and version.
      - Append latest to supported tags only when the workflow declares that tag.
      - Include the mutable-alias statement when latest is declared.
    donts:
      - Do not add a separate GHCR README heading or use stale identity markers.
    examples:
      - "## GHCR publication"
      - "Image: ghcr.io/eliware/example"
      - "Pull command: docker pull ghcr.io/eliware/example:v12.0.0"
      - "Supported tags: vMAJOR.MINOR.PATCH"
      - "Supported tags: vMAJOR.MINOR.PATCH, latest"
      - "Deployment boundary: publication does not deploy; deploy by immutable version tag and recorded sha256 digest."
      - "latest is a mutable convenience alias and is never the release or deployment identity."

  - id: E-0.1.11.1.1
    dos:
      - Keep root Dockerfile and declare root build context.
      - Set one image name ghcr.io/eliware/<unscoped-package-name>.
      - Set the exact v-prefixed package version tag.
      - Make additional tags use that same image name.
      - Keep one publish.yaml shared with npm-published when both apply.
      - Set publication only on push tags matching the candidate glob shown.
      - Set a pre-push guard requiring canonical numeric tag and package-version agreement.
      - Make publication depend on unconditional Ubuntu validation installing npm latest and running npm ci then npm test.
      - Set ghcr-publish as the publication job environment.
      - Set workflow and validation permissions to contents read only.
      - Give the GHCR publisher exactly contents read, packages write, id-token write, attestations write, and artifact-metadata write.
      - Use checkout major v6 and setup-node major v7 when present.
      - Apply npm publisher setup rules when npm publication shares the job.
    donts:
      - Do not declare other image owners, branch publication, pull-request publication, or manual publication.
      - Do not grant publication permissions to validation jobs or require npm setup in jobs not invoking npm.
      - Do not declare deployment commands or continue-on-error on required publication steps.
    examples:
      - "on:\n  push:\n    tags: [\"v[0-9]*.[0-9]*.[0-9]*\"]"
      - "environment: ghcr-publish"
      - "permissions:\n  contents: read\n  packages: write\n  id-token: write\n  attestations: write\n  artifact-metadata: write"

  - id: E-0.1.11.1.2
    dos:
      - Give push steps valid IDs beginning with ASCII letters or underscores and containing only letters, digits, underscores, or hyphens.
      - Set actions/attest major v4 after each final image push.
      - Bind subject-name to the untagged package-derived image and subject-digest to that push step's digest output.
      - Set push-to-registry true.
      - Append the exact digest reference to GITHUB_STEP_SUMMARY through one single-line echo command.
      - Set unconditional post-push steps for version-to-digest verification and image and attestation inspection.
      - Make the final push's required verification chain end at the last job step.
    donts:
      - Do not reference missing steps, unrelated digests, or mutable attestation subjects.
      - Do not use control operators or command substitution in the summary command except its required append redirection.
      - Do not declare bypass conditions or continue-on-error on required verification steps.
    examples:
      - "uses: actions/attest@v4\nwith:\n  subject-name: ghcr.io/eliware/example\n  subject-digest: ${{ steps.push.outputs.digest }}\n  push-to-registry: true"
      - 'echo "${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"'
