version: "14.0"
description: Defines deterministic repository requirements for Eliware GHCR publication.
directives:
  - id: E-0.1.11.1.0
    dos:
      - Add a GHCR publication section to AGENTS.md.
      - Include the exact Usage markers shown with package-derived image identity and
        version.
      - Use only version tags because the canonical workflow does not publish latest.
    donts:
      - Do not use stale identity markers.
      - Do not list latest as a supported tag.
    examples:
      - /eliware/application-template/AGENTS.md
      - /eliware/application-template/README.md

  - id: E-0.1.11.1.1
    dos:
      - Keep the Dockerfile at the repository root.
      - Use .github/workflows/ghcr.yaml as the consumer publication workflow.
      - Log in to ghcr.io with github.actor and secrets.GITHUB_TOKEN before the image push.
      - "Match it byte for byte with the bundled Eliware Test file
        specs/workflows/ghcr.yaml."
      - Include line endings and the final newline in each match.
      - Keep specs/workflows/ghcr.yaml in the Eliware Test package.
    donts:
      - Do not use .github/workflows/publish.yaml for GHCR publication.
      - Do not create specs/workflows/ in a consumer repository.
    examples:
      - /eliware/application-template/.github/workflows/ghcr.yaml
      - /eliware/discord-template/.github/workflows/ghcr.yaml
      - /eliware/mcp-server-template/.github/workflows/ghcr.yaml
      - /eliware/web-template/.github/workflows/ghcr.yaml
