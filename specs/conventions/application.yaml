version: "11.0"
description: Applies to repositories containing application or service code.
requires: []
directives:
  - id: E-0.1.130
    dos:
      - These conventions apply to repositories containing application or service code.
    donts:
      - Application repositories must not omit applicable application requirements.
    directives:
      - id: A-0.1.130.0
        dos:
          - Every application repository must extend the general AGENTS.md requirements with applicable application guidance.
        donts:
          - An application repository must not omit AGENTS.md.
        directives:
          - id: A-0.1.130.0.1
            dos:
              - Applications must validate configuration before opening connections and make shutdown repeatable. Tests must cover the public inputs and externally observable results of every documented, supported user-facing workflow. Human review must identify supported workflows omitted from documentation or tests; passing tests alone do not prove workflow inventory completeness.
              - Applications must provide a root README.md, document runtime configuration and user-visible workflows, and provide .env.example when environment configuration is supported.
            donts:
              - Applications must not open connections from unvalidated configuration or leave externally observable workflows without contract or integration checks.
            directives:
              - id: A-0.1.130.0.1.0
                dos:
                  - The repository owner determines whether the application supports environment configuration from its documented runtime behavior. If it does, .env.example must exist and list every supported variable. Keep required variables active and comment out optional variables with their defaults and available options. Configure MAIL_OWNER_ADDRESS only through an untracked, gitignored .env file and omit it from templates.
                  - Human or AI review during change review must confirm the supported-variable inventory, required/optional classification, defaults, and available options. Record the review findings with the change. Deterministic validation may reject prohibited entries such as MAIL_OWNER_ADDRESS but cannot prove that the template is complete or semantically correct.
                donts:
                  - Do not omit supported environment variables, leave optional variables active, or include MAIL_OWNER_ADDRESS in .env.example.
      - id: A-0.1.130.1
        dos:
          - Under the Configuration and Operations headings assigned to application by general.yaml, document startup and shutdown, runtime settings and defaults (or explicitly state that no runtime configuration exists), externally observable workflows, and operational boundaries. Include both headings in the Table of Contents as required by general.yaml.
          - "After the seven general AGENTS.md headings, add a ## Application section. Document the actual runtime entrypoint(s), lifecycle behavior, runtime configuration sources/defaults (or that none exist), and safe operational boundaries; distinguish these from package metadata and deployment configuration."
        donts:
          - Application README.md must not omit runtime configuration, operational boundaries, or user-visible behavior.
      - id: E-0.1.130.2
        dos:
          - Every application repository must contain docs/README.md for end-user documentation.
        donts:
          - Application repositories must not hide user-facing behavior in internal runbooks or claim operational guarantees that the application does not provide.
        directives:
          - id: A-0.1.130.2.0
            dos:
              - docs/ must contain end-user documentation for the application; docs/README.md must provide its overview and link every discovered end-user document other than docs/README.md itself, which is the index. During change review, a human or AI reviewer must assess whether the documentation set covers supported user-facing workflows and record relevant findings with the change.
              - Application repositories must link docs/README.md from the root README.md.
            donts:
              - Do not duplicate canonical operational procedures or project requirements in end-user docs.
      - id: A-0.1.130.3
        dos:
          - Application package.json must declare its runtime/start entrypoints and environment contract. npm publication intent is declared by the applied npm-published profile; package.json.private controls npm publishability, while repository hosting visibility is separate and governed by the private profile.
          - A declared main or bin file entrypoint must be a nonempty repository-relative path to an existing file; a start script must be a nonempty command.
          - Application repositories are not required to contain examples/. When examples/ is present, examples/README.md must index runnable examples and each example must document prerequisites, commands, and expected results.
        donts:
          - Do not leave application startup, runtime configuration, or distribution intent undefined in package metadata, or include undocumented examples.
      - id: E-0.1.130.4
        dos:
          - Applications must keep executable implementation source under src/ and mirror that structure under tests/ with exactly one corresponding .test.mjs file for every .mjs source file, including source files excluded from coverage. Every test file under tests/ must correspond to a source file under src/; additional unmirrored integration, end-to-end, smoke, or cross-cutting test files are not allowed.
          - Place checked-in fixtures, snapshots, generators, and shared test support with no source counterpart in the repository-root test-fixtures/ directory. Reserve artifacts/ for generated, untracked test output such as Puppeteer screenshots and traces; ignore that directory and do not store checked-in helpers or fixtures there.
        donts:
          - Do not omit src/ or tests/, use mismatched source/test paths, use non-.test.mjs test counterparts, treat coverage exclusions as waivers of the mirror requirement, or duplicate lower-level assertions in higher-level tests.
          - Do not place generated, bundled, compiled, dependency, coverage, or build output in source/test architecture.
      - id: E-0.1.130.5
        dos:
          - Applications must test applicable implementation code without Istanbul coverage-ignore directives; the exact pure export barrel declared as a public package entrypoint is the sole barrel exception.
        donts:
          - Do not hide uncovered production behavior with Istanbul coverage-ignore directives unless the file is the pure export barrel declared as a public package entrypoint.
      - id: E-0.1.130.6
        dos:
          - Application production modules are subject to the single-responsibility rule in general.yaml E-0.1.27. When a change introduces a distinct application responsibility, create a focused submodule and its mirrored test, then wire it through the existing owner or coordinator.
        donts:
          - Do not treat application-profile compliance as a waiver from general.yaml E-0.1.27.
      - id: E-0.1.130.7
        dos:
          - Register application-specific web-service ports with the external Eliware port registry.
        donts:
          - Do not select arbitrary unregistered web-service ports.
      - id: E-0.1.130.8
        dos:
          - Remove superseded compatibility branches, legacy aliases, and fallback behavior when the current contract replaces them.
        donts:
          - Do not preserve obsolete contracts for consumer convenience.
      - id: E-0.1.130.9
        dos:
          - Place unit tests at the lowest module level that directly proves behavior; keep only cross-cutting and integration tests in higher-level orchestrator test directories.
        donts:
          - Do not duplicate lower-level assertions in higher-level tests.
      - id: E-0.1.130.10
        dos:
          - Enforce a maximum of 100 physical lines for each in-scope application source file and 200 physical lines for each in-scope test file. Count blank and comment lines; count an unterminated final line as one line and an empty file as zero. Exclude files under any path segment named .git, build, coverage, dist, generated, node_modules, test-fixtures, fixtures, __fixtures__, or __snapshots__, and exclude filenames ending in .d.mts or .snap.mjs or containing .generated. These exclusions apply only to physical line counting; they do not exempt .mjs files under src/ or tests/ from source/test mirroring and do not change syntax, lint, formatting, coverage, or other check inventories. Count handwritten data tables and static mappings as ordinary physical lines; the stated path/filename exclusions apply regardless of file contents. Apply the same counting and exclusion contract to source and test files. Exceeding either maximum is a blocking convention failure and requires decomposition into focused modules with mirrored tests.
          - "Apply the single-responsibility requirement independently at every file size: being within the line maximum does not prove cohesion or permit distinct responsibilities to share a module, and a mixed-responsibility module must be split even when it is below the maximum."
        donts:
          - Do not treat compliance with a line maximum as permission to mix responsibilities, or reduce line count superficially without creating focused modules and mirrored tests.
      - id: E-0.1.130.11
        dos:
          - Application repositories are subject to the shared package-reuse review in general.yaml E-0.1.27 and its example mapping. Human review must determine whether application production code owns a mapped concern; deterministic validation must not report that review as passed.
        donts:
          - Do not report the shared package-reuse review as deterministically passed.
      - id: E-0.1.130.12
        dos:
          - Applications must not use pure export barrels as internal convenience modules.
        donts:
          - Do not create pure barrel files for internal modules or unrelated convenience re-exports.
      - id: E-0.1.130.13
        dos:
          - Jest is the required test runner for this profile. Run its suites through eliware-test; test files may import APIs from @jest/globals supplied transitively. Alternative test runners do not satisfy this profile.
        donts:
          - Do not invoke Jest directly, import Jest runner/CLI modules, or declare Jest packages directly.
      - id: E-0.1.130.14
        dos:
          - Application Jest coverage must use Istanbul and report 100% statements, branches, functions, and lines with zero uncovered lines for in-scope production code; coverage scope is limited to native ESM .mjs production files under src/. Jest and Istanbul are the required profile tools; alternate test runners or coverage engines do not satisfy this profile.
          - Exclude generated, bundled, compiled, dependency, coverage, build, declaration, fixture, and snapshot files from in-scope code.
        donts:
          - Do not hide untested production logic with coverage exclusions.
      - id: E-0.1.130.15
        dos:
          - Keep application test execution quiet unless output is under test or an intentional failure diagnostic.
        donts:
          - Do not allow incidental logs, console output, debug traces, or process output to leak from normal test runs.
      - id: E-0.1.130.16
        dos:
          - Application entrypoints must be thin and delegate unrelated business logic to focused modules.
        donts:
          - Do not place unrelated business logic in an application entrypoint.
      - id: E-0.1.130.17
        dos:
          - Use dependency injection to keep application modules independently testable.
        donts:
          - Do not hard-code replaceable external dependencies when dependency injection can keep a module testable.
