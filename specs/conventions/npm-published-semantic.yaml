version: "13.0"
description: Lists semantic rules for publicly distributed Eliware npm packages.
directives:
  - id: E-0.1.10.0.0
    dos:
      - Document install commands, entrypoints, package files, version rules, and
        publication limits from package.json, exports, and the publish workflow.
      - Include each runtime asset loaded by a package entrypoint or named in consumer
        documentation.
      - Include each environment variable declared by code or schemas in package examples.
      - Use placeholder values for each credential and private endpoint in examples.
      - Describe release authorization from Operations procedures without granting publish
        authority through repository instructions.
      - Compare consumer claims with package metadata, entrypoint code, tests, and workflow
        files.
    donts:
      - Do not omit runtime assets.
      - Do not publish sensitive content.
