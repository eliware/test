version: "13.0"
description: Lists deterministic rules for Eliware MCP server applications.
directives:
  - id: E-0.1.8.1.0
    dos:
      - Add an MCP server section to AGENTS.md.
      - >-
        Add `Tools`, `Resources`, `Prompts`, `Transport`, `Authentication`, and `Schemas`
        sections to README.md.
    donts:
      - Do not omit MCP-specific headings.
    examples:
      - "## MCP server"
      - "## Configuration


        ## Operations


        ## Tools


        ## Resources


        ## Prompts


        ## Transport


        ## Authentication


        ## Schemas"

  - id: E-0.1.8.1.1
    dos:
      - Put each tool adapter in tools/<name>.mjs.
      - Put each tool handler in src/tools/<name>.mjs.
      - Make each tools/ adapter re-export its matching source handler.
      - Use a default function export in each tool handler.
      - Allow each tool name when matching adapter and handler files are in the repository.
      - Provide one or more tool adapters.
    donts:
      - Do not omit a tool adapter or its matching source handler.
      - Do not import or execute repository handlers during validation.
    examples:
      - "tools/echo.mjs re-exports src/tools/echo.mjs."
      - "src/tools/echo.mjs default-exports a tool registration function."
