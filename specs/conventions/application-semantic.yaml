version: "13.0"
description: Lists semantic rules for Eliware applications and services.
requires:
  - general
conflicts:
  - library
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.4.0.0
    dos:
      - Document workflows, entrypoints, startup paths, shutdown paths, and configuration
        values listed in README.md, linked documents, or package metadata.
      - Keep documentation current and complete for those workflows and values.
      - Distinguish runtime settings from metadata and deployment configuration.
      - Document when runtime configuration is missing.
      - Describe each environment variable, default, option, and required or optional
        status declared by code or configuration schemas.
      - For each environment variable in code or schemas, show its name, default, and
        required status with placeholder values.
      - Name each configuration value without a default.
      - Give each example's prerequisites, commands, and results that tests or code
        show.
      - Compare README.md, linked documents, package metadata, configuration schemas,
        maintained code, tests, and workflows for each application claim.
    donts:
      - Do not hide user-facing behavior in internal runbooks.
      - Do not claim a guarantee unless maintained code, tests, or public documentation
        show it.
      - Do not omit settings declared by code or schemas.
      - Do not enable optional environment variables in templates.

  - id: E-0.1.4.0.1
    dos:
      - Validate configuration before opening connections.
      - Make shutdown repeatable.
      - Test each public input and each workflow result stated in README.md or linked API
        documents.
      - Keep unit assertions with the module that owns the behavior.
      - Keep coordinator tests for calls and results across module boundaries.
      - Allow replacement dependencies.
      - Keep launchers simple.
      - Remove superseded compatibility branches, aliases, and fallbacks.
      - Use `@eliware/redact` for redaction and `@eliware/log` to write logs.
      - Use `@eliware/path` for file system and import-meta utilities.
      - Use `@eliware/errors` for failed operations and rejected promises.
      - Use `@eliware/signals` for signal handling and orderly shutdown.
      - Test outputs and side effects stated in documentation or workflow contracts.
      - Compare maintained code, tests, package metadata, configuration schemas, and
        package scripts for these requirements.
    donts:
      - Do not open connections using unvalidated configuration.
      - Do not omit tests for workflows listed in README.md, linked documents, or package
        metadata.
      - Do not duplicate helper assertions.
      - Do not preserve obsolete contracts or hide behavior through coverage exclusions.
    examples:
      - "Redaction uses @eliware/redact and logging uses @eliware/log."
      - "Filesystem and import-meta utilities use @eliware/path."
      - "Exception and rejection handling uses @eliware/errors."
      - "Signals and graceful shutdown use @eliware/signals."

  - id: E-0.1.4.0.2
    dos:
      - Describe each user-visible change in RELEASE_NOTES.md.
      - List each breaking change, migration step, and `security` change shown by the
        release diff, tests, and configuration changes.
      - Compare RELEASE_NOTES.md with the changes since the prior repository tag.
    donts:
      - Do not omit user-impacting changes.
      - Do not duplicate requirements in release notes.
