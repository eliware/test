version: "11.0"
description: Applies to repositories containing CLI code.
requires:
  - application
directives:
  - id: E-0.1.60
    dos:
      - These conventions apply to repositories containing CLI application code.
      - CLI application repositories must explicitly list the application and cli profile names in package.json.eliware.apply; their rules are defined in application.yaml and cli.yaml.
    donts:
      - CLI application repositories must not omit the application profile or applicable CLI requirements.
    directives:
      - id: A-0.1.60.0
        dos:
          - Every CLI repository must extend the general AGENTS.md requirements with applicable CLI guidance.
        donts:
          - A CLI repository must not omit AGENTS.md.
        directives:
          - id: A-0.1.60.0.1
            dos:
              - "After the seven general AGENTS.md headings, add a ## CLI section. Document each executable entrypoint and its target; command/subcommand names; option and positional-argument parsing, defaults, validation, forwarding, and errors; exit-code meanings and mapping; supported platforms and platform-specific behavior; --help and --version behavior; and destructive-action safeguards such as dry-run, confirmation, and scope limits. Include applicable validation commands."
            donts:
              - AGENTS.md must not leave CLI entrypoints or required CLI validation undefined.
      - id: E-0.1.60.1
        dos:
          - CLI applications must implement and document --help and --version, and document exit codes and redacted output. Place executable entrypoints under bin/ as required by application.yaml. Human review must identify each command that can change or delete state; each such command must provide dry-run, confirmation, or an equivalent safeguard. A CLI with no state-changing or destructive commands requires no destructive-action safeguard.
          - When focused test execution is supported, document and test each supported focused-invocation extension and its source mapping; map .mts and .cts invocations to .mjs sources and map other supported extensions to the same source extension. Focused invocation support does not change application or library source/test mirroring, which requires exactly one .test.mjs file for each .mjs source.
          - "Document wrapper-owned options and the separator boundary explicitly: --debug-timing is accepted only before a focused path or tool mode (or alone for aggregate validation) and is rejected after --; arguments after -- are forwarded to the selected mode subject to that mode's allowlist or to Jest for focused tests."
        donts:
          - CLI applications must not omit --help, --version, or safeguards for state-changing commands, or expose secrets. Deterministic checks must not infer destructive behavior from command names or keyword presence.
      - id: A-0.1.60.2
        dos:
          - Under the Commands and Exit codes headings assigned to cli by general.yaml, document installation, each user-facing command and important options, --help, --version, safe copyable examples, supported platform behavior, exit-code meanings, and safeguards for destructive actions. Include the headings in the Table of Contents as required by general.yaml. The deterministic README check verifies only required headings and anchor terms; it does not prove that the documented commands, options, examples, platform behavior, exit codes, or safeguards are complete or accurate. Review of that content is non-deterministic and must not be reported as passing based on the deterministic check.
          - README.md and AGENTS.md must identify supported platforms separately from validation evidence. Describe direct validation such as developer testing or CI, and state the rationale when compatibility is inferred from another validated platform. Do not describe inferred compatibility as direct testing.
        donts:
          - Do not show a destructive command without dry-run, confirmation, or equivalent safety behavior; do not require these controls when the CLI has no destructive commands. Do not conflate supported platforms, direct validation evidence, and compatibility inferred from another platform.
