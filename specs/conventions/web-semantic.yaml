version: "12.0"
description: Defines semantic requirements for Eliware web applications.
requires:
  - application
directives:
  - id: E-0.1.6.0.0
    dos:
      - Document routes, ownership, assets, runtime and build settings, ports, output paths, and deployment boundaries accurately.
      - Explain browser-validation prerequisites, commands, and expected results.
      - Define acceptance expectations for supported browser workflows.
      - Keep public assets limited to intentionally served content.
      - State when a documented category does not apply.
    donts:
      - Do not expose private configuration or imply deployment authorization.
      - Do not claim browser or deployment validation that was not performed.
