version: "13.0"
description: Lists deterministic rules for Eliware database applications.
requires:
  - application
conflicts:
  - library
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.13.1.0
    dos:
      - Require application in the database profile's requires list.
      - List library, documentation, workspace, and infrastructure in the database
        profile's conflicts list.
      - Use E-0.0.0 to validate profile selection, requirements, conflicts, and canonical
        order.
      - Keep the database profile metadata equal in the two convention files.
    donts:
      - Do not select the database profile from source files or package dependencies.
      - Do not apply the database profile with library, documentation, workspace, or
        infrastructure.
      - Do not add deterministic checks for SQL meaning, data invariants, recurring
        writes, or migration meaning.
