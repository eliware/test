version: "13.0"
description: Defines semantic requirements shared by Eliware repositories.
requires: []
conflicts: []
directives:
  - id: E-0.1.0.0.0
    dos:
      - Describe repository purpose, owner, scope, and boundaries from package metadata,
        maintained code, and canonical repository documents.
      - Use package.json keywords for GitHub topic sync.
      - Use each keyword to name a package purpose, platform, protocol, technology, or
        subject that code and package behavior provide.
      - Add a platform keyword when README.md or linked support documents say that the
        package supports it.
      - Keep each keyword only when maintained code, package behavior, README.md, or linked
        documents support its claim.
      - Match README branding, section order, support copy, and link labels to
        the canonical deterministic examples.
      - Match each public link label to its destination and stated action.
      - Keep documentation current and complete for uses described in README.md, package
        metadata, and maintained workflows.
      - Give contributors commands and steps for tasks listed in package scripts and
        maintained workflows.
      - Compare documentation with maintained code, configuration, package scripts,
        schemas, workflows, tests, and release records.
      - Identify runtime settings from schemas and code.
      - Identify package metadata from package.json.
      - Identify CLI arguments from the CLI parser.
      - Identify deployment settings from workflow files.
      - Compare claims about released behavior with RELEASE_NOTES.md, package.json, and
        repository tags.
      - Update each GitHub Action to its latest major version when Eli learns about a
        newer major version.
    donts:
      - Do not use misleading identities, stale instructions, or unsupported package claims.
      - Do not require a fixed keyword list or all query terms.
      - Do not add private repository links or more public branding to repository
        READMEs.
      - Do not confuse npm publishability with source-hosting visibility.
      - Do not claim that unpublished versions are available.

  - id: E-0.1.0.0.1
    dos:
      - Keep requirements and canonical procedures authoritative in one location.
      - Compare each procedure with its owning specification or Operations directive.
      - Use documentation for context and links to the authoritative specification or
        procedure.
      - Limit repository specifications to committed content and repository validation.
      - Name each action that requires approval, the approving role, and its governing
        procedure.
    donts:
      - Do not maintain competing normative copies.
      - Do not use local instructions to weaken shared requirements.
      - Do not turn AGENTS.md into a second README, implementation specification, or
        release history.
      - Do not authorize releases or deployments from validation success.
      - Do not add GitHub API calls to local deterministic checks.
    examples:
      - "Use the Operations directives for cross-repository procedures."

  - id: E-0.1.0.0.2
    dos:
      - Exclude unapproved secrets, credentials, private data, decrypted sensitive
        payloads, operational backups, production dumps, and runtime data from repository contents.
      - Distinguish minimal non-sensitive bootstrap data from backups and live database
        contents.
      - Limit internal infrastructure details to users with repository access.
      - Compare tracked files, generated artifacts, and repository access settings for each
        data or access claim.
    donts:
      - Do not expose private access information or machine details through public
        documentation.
      - Do not store operational backups in repository contents.

  - id: E-0.1.0.0.3
    dos:
      - Give each source and test module one cohesive purpose and one cause for change.
      - Split a source or test module when its behavior, tests, or reasons for change show
        more than one responsibility.
      - Put each split responsibility in a submodule and call it through its owning module.
      - Keep coordinators responsible for their own orchestration.
      - Compare module behavior, mirrored tests, and causes for change to set responsibility
        boundaries.
      - Keep a dependency when maintained code imports it, a package script invokes it, or
        maintained tool configuration names it.
    donts:
      - Do not combine responsibilities for convenience.
      - Do not keep multiple responsibilities in a module that you change.
      - Do not keep dependencies that maintained code does not use.

  - id: E-0.1.0.0.4
    dos:
      - Apply these rules to all text written for readers.
      - Use concise, complete sentences.
      - Use plain words and established technical terms.
      - Define technical terms when readers do not know them.
      - Use each term with one stable meaning.
      - Keep noun groups to three words or fewer.
      - Use simple verb forms and active voice.
      - Use a command in each instruction.
      - Put conditions before commands and add a comma after each condition.
      - Use one instruction in each sentence unless actions occur at the same time.
      - Use complete sentences and include required articles.
      - Use connecting words to show how ideas connect.
      - Use vertical lists for complex information.
      - Keep procedural items and descriptions in different lists.
      - Give each paragraph one topic.
      - Use standard punctuation and American English spelling unless an official name
        requires a different format.
      - Use hyphens only to connect related words.
      - Use parentheses only for source links, identifiers, alternatives, or explanations.
      - Use inclusive terms and pronouns.
      - Use pronouns only when readers can identify their nouns.
      - Use `this` only when the noun is explicit.
      - Use one style for recurring tasks.
    donts:
      - Do not use slang, regional terms, or unclear jargon.
      - Do not use one term for different items or different terms for the same item.
      - Do not use technical nouns for actions or technical verbs for objects.
      - Do not use complex tenses or ongoing verb forms.
      - Do not use passive voice or action nouns to replace verbs.
      - Do not use contractions or unfinished sentences.
      - Do not omit articles when a sentence needs them.
      - Do not combine different instructions in one sentence.
      - Do not write sentences that readers cannot understand in one pass.
      - Do not combine instructions and descriptions in one list.
      - Do not put unrelated topics in one paragraph.
      - Do not use unclear parentheses.
      - Do not create phrasal verbs or use Latin abbreviations.
      - Do not use a pronoun when its meaning is unclear.
      - Do not change exact required text, identifiers, or official names.
