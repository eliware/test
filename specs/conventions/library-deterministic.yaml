version: "13.0"
description: Lists deterministic rules for Eliware libraries.
directives:
  - id: E-0.1.3.1.0
    dos:
      - Add a Library section to AGENTS.md.
      - Tell developers to run focused tests first during development.
      - Pass one or more test paths to npm test for focused testing.
      - Show valid npm test commands for one test file and multiple test files.
      - Tell developers to prevent repeated full-suite runs during development.
      - Require the full npm test suite for final validation before a commit, milestone,
        or release.
      - Add API, Packaging, and Examples sections to README.md.
      - Keep docs/README.md.
      - Keep examples/README.md.
      - Link the two indexes from root README.md.
      - Index all Markdown documents in docs/ other than its index.
      - Keep and index one or more native-ESM .mjs or .js examples in examples/.
    donts:
      - Do not require .cjs examples. Index all discovered examples.
    examples:
      - /eliware/library-template/AGENTS.md
      - /eliware/library-template/README.md

  - id: E-0.1.3.1.1
    dos:
      - Define explicit exports that target existing runtime files in src/.
      - Require package.json.main to target an existing runtime module in src/.
      - Keep declaration metadata in src/ when supplied.
      - Store each .d.ts declaration and its same-basename .mjs implementation in one directory.
      - Use one typecheck command that invokes a declared typechecker package.
      - Run typecheck during aggregate validation.
      - Allow pure export barrels only for primary public entrypoints or indexes.
    donts:
      - Do not chain typecheck.
      - Do not redirect typecheck.
      - Do not add internal convenience barrels.
    examples:
      - /eliware/library-template/package.json

  - id: E-0.1.3.1.2
    dos:
      - Mirror each src/ .mjs file with exactly one same-path tests/ .test.mjs file.
      - Keep library implementation in src/.
      - Give each test file a matching source path and an executable Jest test callback.
      - Keep unmatched fixtures, snapshots, generators, and test support in root
        test-fixtures/.
      - Keep generated test output in ignored artifacts/.
      - Limit each src/ .mjs file to 100 physical lines and each tests/ .test.mjs file to 200.
      - Include empty lines, comments, and the final unterminated line in counts.
    donts:
      - Do not exclude source files from mirroring or line limits for coverage exclusions.
      - Do not put generated output or unmatched tests and support files in src/ or
        tests/.
      - Do not count skipped, todo, or describe-only declarations in executable test totals.
    examples:
      - /eliware/library-template/src/create-greeting.mjs
      - /eliware/library-template/tests/create-greeting.test.mjs

  - id: E-0.1.3.1.3
    dos:
      - Run required Jest tests through eliware-test with the exact configuration shown.
      - For @eliware/test, allow direct dependencies on @jest/globals, jest, and
        istanbul-lib-instrument.
      - For @eliware/test, allow istanbul-lib-instrument imports and direct Jest commands
        outside package scripts.
      - Use mocked file-system operations in each test suite.
      - Mock file-handle write methods or inject mocked file handles.
      - Allow network requests to localhost only.
      - Use fake timers or injected fixed clocks.
      - Mock child-command calls and other external effects.
      - Use Istanbul coverage for production .mjs files in src/.
      - Require 100 percent statements, branches, functions, and lines with zero uncovered
        lines.
      - Allow coverage exclusions only in the exact primary public entrypoint.
      - Allow Istanbul ignore directives there only when it is a pure export barrel.
      - Keep console and child-command output out of passing test runs.
    donts:
      - Do not modify files in tests.
      - Do not access external network services in tests.
      - Do not launch OS commands or command-line tools in tests.
      - Do not use wall-clock waits, sleeps, or uncontrolled timers in tests.
      - Do not invoke Jest or coverage tools directly in consumer repositories.
      - Allow listed harness tools only in @eliware/test.
      - Do not use a second test runner.
      - Do not use a second coverage engine.
      - Do not add second Jest configuration.
      - Do not ignore coverage in other production modules.
    examples:
      - /eliware/library-template/package.json

  - id: E-0.1.3.1.4
    dos:
      - Keep RELEASE_NOTES.md.
      - Link RELEASE_NOTES.md from README.md Usage.
      - Use the exact level-one title and level-two entry formats shown.
      - Use versioned level-two entries only.
      - Keep one or more versioned release entries.
      - Match the newest versioned entry with package.json.version.
      - Require a v<version> repository tag for each prior release entry.
      - Allow the current package.json.version without a repository tag.
      - Make all repository tags available during validation.
      - Use valid calendar dates and unique descending numeric SemVer versions with
        non-increasing dates.
      - Give each entry one or more level-three categories from `Added`, `Changed`, `Fixed`,
        `Breaking changes`, `Migration`, or `Security`.
      - Give each category user-visible change text.
      - Do not use a category more than one time in one entry.
      - Put all release text in a release category.
      - Put all headings in a release entry or category.
    donts:
      - Do not use the word Unreleased in RELEASE_NOTES.md.
      - Do not duplicate versions.
      - Do not use malformed, empty, unsupported, or out-of-order sections.
    examples:
      - /eliware/library-template/RELEASE_NOTES.md
