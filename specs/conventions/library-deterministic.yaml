version: "12.0"
description: Lists deterministic rules for Eliware libraries.
requires:
  - general
conflicts:
  - application
  - cli
  - web
  - discord
  - mcp-server
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.3.1.0
    dos:
      - Add a Library section to AGENTS.md.
      - Add API, Packaging, and Examples sections to README.md.
      - Keep docs/README.md.
      - Keep examples/README.md.
      - Link both indexes from root README.md.
      - Index every Markdown document beneath docs/ except its index.
      - Keep and index at least one native-ESM .mjs or .js example under examples/.
    donts:
      - Do not count .cjs files as required examples or leave discovered examples unindexed.
    examples:
      - "## Library"
      - "## API\n\n## Packaging\n\n## Examples"

  - id: E-0.1.3.1.1
    dos:
      - Define explicit exports targeting existing runtime files under src/.
      - Require package.json.main to target an existing runtime module under src/.
      - Keep declaration metadata under src/ when present.
      - Place each .d.ts declaration beside its same-basename .mjs implementation.
      - Define typecheck as one command that invokes a directly declared typechecker.
      - Run typecheck during aggregate validation.
      - Allow pure export barrels only as the primary public entrypoint or index.
    donts:
      - Do not chain typecheck.
      - Do not redirect typecheck.
      - Do not add internal convenience barrels.
    examples:
      - '{"main":"./src/index.mjs","exports":"./src/index.mjs","types":"./src/index.d.ts"}'

  - id: E-0.1.3.1.2
    dos:
      - Mirror every src/ .mjs file with exactly one same-path tests/ .test.mjs file.
      - Keep library implementation under src/.
      - Give every test file a matching source, executable Jest test callback, and matching source reference.
      - Keep unmatched fixtures, snapshots, generators, and test support under root test-fixtures/.
      - Keep generated test output under ignored artifacts/.
      - Limit every .mjs file under src/ to 100 physical lines and every .test.mjs file under tests/ to 200.
      - Count blank lines, comments, and unterminated final lines.
    donts:
      - Do not exempt source files from mirroring or line limits because of coverage exclusions.
      - Do not put generated output or unmatched tests and support files under src/ or tests/.
      - Do not count skipped, todo, or describe-only declarations as executable tests.
    examples:
      - "src/parser/options.mjs mirrors tests/parser/options.test.mjs."

  - id: E-0.1.3.1.3
    dos:
      - Run required Jest tests through eliware-test with the exact configuration shown.
      - Use Istanbul coverage for production .mjs files under src/.
      - Reach 100 percent statements, branches, functions, and lines with zero uncovered lines.
      - Allow coverage exclusions only in the exact primary public entrypoint.
      - Allow Istanbul ignore directives there only when it is a pure export barrel.
      - Keep successful test runs free of console and process output.
    donts:
      - Do not directly invoke Jest, import its runner, or directly declare Jest packages.
      - Do not substitute other test runners.
      - Do not substitute other coverage engines.
      - Do not add separate Jest configuration.
      - Do not ignore coverage in other production modules.
    examples:
      - '{"testEnvironment":"node","testMatch":["**/tests/**/*.test.mjs"],"collectCoverageFrom":["src/**/*.mjs"],"coverageReporters":["text","json-summary"],"coverageThreshold":{"global":{"branches":100,"functions":100,"lines":100,"statements":100}}}'

  - id: E-0.1.3.1.4
    dos:
      - Keep RELEASE_NOTES.md.
      - Link RELEASE_NOTES.md from README.md Usage.
      - Use the exact level-one title and level-two entry formats shown.
      - Allow one Unreleased section before versioned entries.
      - Use valid calendar dates, strictly descending numeric SemVer versions, and non-increasing dates.
      - Give every entry nonempty level-three subsections from Added, Changed, Fixed, Breaking changes, Migration, or Security.
    donts:
      - Do not duplicate versions.
      - Do not use malformed, empty, unsupported, or out-of-order sections.
    examples:
      - "# Release Notes\n\n## Unreleased\n\n### Changed\n\nPending change.\n\n## 12.0.0 — 2026-06-01\n\n### Added\n\nInitial release."
