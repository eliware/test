version: "13.0"
description: Lists deterministic rules for Eliware Discord applications.
directives:
  - id: E-0.1.7.1.0
    dos:
      - Use canonical order for Discord commands, events, and permissions.
    donts:
      - Do not change the canonical Discord order.
    examples:
      - "discord: [Commands, Events, Intents and permissions]"

  - id: E-0.1.7.1.1
    dos:
      - Add a Discord section to AGENTS.md.
      - Add Events and Intents and permissions sections to README.md.
    donts:
      - Do not omit Discord-specific headings.
    examples:
      - /eliware/discord-template/AGENTS.md
      - /eliware/discord-template/README.md

  - id: E-0.1.7.1.2
    dos:
      - Put each command definition in commands/<name>.json.
      - Set each command definition name to its file name without the extension.
      - Put each command adapter in commands/<name>.mjs.
      - Put each command handler in src/commands/<name>.mjs.
      - Use a type 1 command definition with valid names and descriptions.
      - Define localized command names and descriptions for each supported locale.
      - Use the supported locale list in this directive for locale records and command
        localization.
      - Put each locale record in locales/<locale>.json.
      - Include each supported locale in this list.
      - Keep each locale record's keys equal to locales/en-US.json keys.
      - Put each event adapter in events/<name>.mjs.
      - Put each event handler in src/events/<name>.mjs.
      - Include clientReady.mjs and interactionCreate.mjs event adapters and handlers.
      - Make each root command and event adapter re-export its matching default handler.
      - Use a default function export in each command and event handler.
    donts:
      - Do not omit a command definition or its matching adapter or handler.
      - Do not omit a locale record.
      - Do not add an unsupported locale record.
      - Do not add locale keys that are missing from locales/en-US.json.
      - Do not require optional Discord event adapters.
      - Do not import or execute repository handlers during validation.
    examples:
      - /eliware/discord-template/commands/help.json
      - /eliware/discord-template/commands/help.mjs
      - /eliware/discord-template/src/commands/help.mjs
      - /eliware/discord-template/events/clientReady.mjs
      - /eliware/discord-template/src/events/clientReady.mjs
      - /eliware/discord-template/events/interactionCreate.mjs
      - /eliware/discord-template/src/events/interactionCreate.mjs
      - /eliware/discord-template/locales/en-US.json
      - /eliware/discord-template/src/locales/supported-locales.mjs
