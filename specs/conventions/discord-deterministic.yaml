version: "12.0"
description: Defines deterministic requirements for Eliware Discord applications.
requires:
  - application
directives:
  - id: E-0.1.7.1.0
    dos:
      - Add Discord to AGENTS.md at the canonical profile position.
      - Add Commands, Events, Intents and permissions, and Operations to README.md and its Table of Contents.
      - Deduplicate headings shared with other profiles.
    donts:
      - Do not omit Discord-specific headings.
    examples:
      - "## Discord"
      - "## Commands\n\n## Events\n\n## Intents and permissions\n\n## Operations"
