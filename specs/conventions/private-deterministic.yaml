version: "12.0"
description: Lists deterministic rules for private Eliware distribution.
requires:
  - general
conflicts:
  - npm-published
directives:
  - id: E-0.1.12.1.0
    dos:
      - Set private true.
      - Add a Private distribution section to AGENTS.md.
      - Reject npm publication commands in package scripts and GitHub workflows.
      - Reject NPM_TOKEN and NODE_AUTH_TOKEN settings in package scripts and GitHub workflows.
    donts:
      - Do not declare npm publication commands or npm publication tokens in scripts or workflows.
    examples:
      - "## Private distribution"
      - '{"private":true,"eliware":{"id":"E-38","apply":["general","private"]}}'
