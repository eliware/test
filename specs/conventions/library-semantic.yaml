version: "13.0"
description: Lists semantic rules for Eliware libraries.
requires:
  - general
conflicts:
  - application
  - database
  - cli
  - web
  - discord
  - mcp-server
  - documentation
  - workspace
  - infrastructure
directives:
  - id: E-0.1.3.0.0
    dos:
      - Document each exported API, workflow, compatibility promise, install step,
        runtime setting, and package file declared in package metadata or public docs.
      - Keep documentation current and comprehensive for those APIs and workflows.
      - Explain each example's prerequisites, commands, and results shown by tests or
        maintained code.
      - Describe each environment variable, default, option, and required or optional
        status declared by code or configuration schemas.
      - For each environment setting in code or schemas, show its name, default, and
        required status with placeholder values.
      - Compare public docs with exports, package metadata, configuration schemas,
        maintained code, tests, and release records.
    donts:
      - Do not present private implementation as public API.
      - Do not claim compatibility beyond versions named in public documentation and CI
        configuration.
      - Do not omit settings declared by code or schemas.
      - Do not enable optional environment variables in templates.

  - id: E-0.1.3.0.1
    dos:
      - Test each public contract and workflow result stated in public documentation.
      - Keep unit assertions with the module that owns the behavior.
      - Keep coordinator tests for calls and results across module boundaries.
      - Inject replaceable external dependencies.
      - Keep entrypoints thin.
      - Remove superseded compatibility branches, aliases, and fallbacks.
      - Use @eliware/redact for redaction and @eliware/log for logging.
      - Use @eliware/path for filesystem and import-meta utilities.
      - Use @eliware/errors for exception and rejection handling.
      - Use @eliware/signals for signal handling and graceful shutdown.
      - Test outputs and side effects stated in public contracts.
      - Review package exports, package metadata, maintained code, tests, and package
        scripts for these requirements.
    donts:
      - Do not duplicate helper assertions or preserve obsolete contracts for convenience.
      - Do not hide production behavior through coverage exclusions.
    examples:
      - "Redaction uses @eliware/redact and logging uses @eliware/log."
      - "Filesystem and import-meta utilities use @eliware/path."
      - "Exception and rejection handling uses @eliware/errors."
      - "Signals and graceful shutdown use @eliware/signals."

  - id: E-0.1.3.0.2
    dos:
      - Describe each consumer-visible change in RELEASE_NOTES.md.
      - List each breaking change, migration step, and security change shown by the
        release diff, tests, and package changes.
      - Compare RELEASE_NOTES.md with the changes since the prior repository tag.
    donts:
      - Do not omit consumer-impacting changes.
      - Do not use release notes as a second specification.
