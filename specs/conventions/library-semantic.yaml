version: "15.0"
description: Lists semantic rules for Eliware libraries.
directives:
  - id: E-0.1.3.0.0
    dos:
      - Document exported APIs, workflows, compatibility promises, install steps,
        runtime values, and package files declared in package metadata or public docs.
      - Keep documentation current and complete for those APIs and workflows.
      - Give each example's prerequisites, commands, and results shown by tests or
        maintained code.
      - Describe each environment variable, default, option, and required or optional
        status declared by code or configuration schemas.
      - For each environment variable in code or schemas, show its name, default, and
        required status with placeholder values.
      - Compare public docs with exports, package metadata, configuration schemas,
        maintained code, tests, and release records.
    donts:
      - Do not show private implementation in public API documentation.
      - Do not claim compatibility with versions not named in public docs or CI configuration.
      - Do not omit settings declared by code or schemas.
      - Do not enable optional environment variables in templates.

  - id: E-0.1.3.0.1
    dos:
      - Test each public contract and workflow result stated in public documentation.
      - Keep unit assertions with the module that owns the behavior.
      - Keep coordinator tests for calls and results across module boundaries.
      - Allow replaceable external dependencies.
      - Keep entrypoints simple.
      - Remove superseded compatibility branches, aliases, and fallbacks.
      - Add a direct dependency for each lower-level package that provides a function the
        library uses.
      - Use functions from existing packages.
      - Import each function from the package that provides it.
      - Test outputs and side effects stated in public contracts.
      - Compare package exports, package metadata, maintained code, tests, and package
        scripts for these requirements.
    donts:
      - Do not add `@eliware/common` as a dependency.
      - Do not use a shared function without a direct dependency on its package.
      - Do not add a function that an existing package provides.
      - Do not duplicate helper assertions or preserve obsolete contracts for convenience.
      - Do not hide production behavior through coverage exclusions.
    examples:
      - '`@eliware/app`: `import { redactText } from "@eliware/common";`'
      - '`@eliware/library`: `import { redactText } from "@eliware/redact";`'
