$schema: https://json-schema.org/draft/2020-12/schema
title: Eliware package metadata schema
type: object
required:
  - id
  - apply
properties:
  id:
    type: string
    pattern: ^E-[0-9]+$
  apply:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
      pattern: \S
  exempt:
    type: array
    items:
      type: object
      required:
        - ruleId
        - reason
        - approver
        - approvalTimestamp
        - expiry
      properties:
        ruleId:
          type: string
          minLength: 1
          pattern: \S
        reason:
          type: string
          minLength: 1
          pattern: \S
        approver:
          const: Eli
        approvalTimestamp:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T.+(Z|[+-][0-9]{2}:[0-9]{2})$
        expiry:
          oneOf:
            - type: string
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
            - type: "null"
        paths:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            allOf:
              - not:
                  pattern: ^/
              - not:
                  pattern: "^[A-Za-z]:"
              - not:
                  pattern: '\\'
              - not:
                  pattern: //
              - not:
                  pattern: /$
              - not:
                  pattern: (^|/)\.{1,2}(/|$)
additionalProperties: false
