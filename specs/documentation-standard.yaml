version: "11.0"
description: Company standard for structured documentation directives.
directiveSchema:
  requiredDocumentFields:
    - version
    - description
    - directives
  requiredDirectiveFields:
    - id
    - dos
    - donts
  optionalDirectiveFields:
    - directives
    - examples
  idPrefixes:
    E: Explicitly specified by Eli; immutable without Eli's consent.
    A: AI-generated or AI-inferred guidance; revisable to align with E directives.
  idPattern: ^(E|A)-[0-9]+(\.[0-9]+)*$
  hierarchy:
    root: The first numeric segment identifies the document's root directive.
    child: A child extends its parent's complete numeric path by one segment.
    uniqueness: Numeric paths are globally unique regardless of E or A prefix.
    topLevel: Top-level directives must be E directives.
    ancestors: Every A directive must have an E ancestor. E directives may only have E ancestors. A directives may have E or A parents.
  arrays:
    dos: Non-empty array of non-blank concise required actions.
    donts: Non-empty array of non-blank concise prohibitions.
    directives: When present, a non-empty array of child directives.
    examples: When present, an array of example records with non-blank purpose and markdown strings.
  documentAdditionalFields: []
  recordAdditionalFields: []
