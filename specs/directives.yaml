version: "12.0"
description: Sets rules for Eliware Test execution, checks, and public interfaces.
directives:
  - id: E-0.0
    dos:
      - Run deterministic repository validation through eliware-test.
      - Enforce each selected profile's bundled deterministic rules.
      - Use convention documents as the source for consumer requirements.
      - Reject overlapping runs in one worktree.
    donts:
      - Do not enforce semantic conventions or duplicate consumer requirements.
      - Do not require an external repository to load bundled checks.
        - Do not publish, deploy, sync, tag, push, or change external state during validation.
        - Do not expose internal modules or injected helpers as consumer APIs.
    children:
      - id: E-0.0.0
        dos:
          - Parse settings and arguments before validation.
          - Resolve selected profiles and their listed prerequisites.
          - Match each profile pair's version and prerequisite list.
          - Find checks under src/checks/<profile>/ by directive ID filename.
          - Match each module name, exported ruleId, directive, and reported ID.
          - Show directive ancestry in check subfolders.
          - Check exemptions against the full bundled check tree.
          - Skip exempt checks and their discovered children.
          - Read /eliware/docs/repo-map.yaml only when it exists and a convention needs it.
        donts:
          - Do not infer profiles from repository contents or runtime behavior.
          - Do not run validation with invalid required settings.
          - Do not accept duplicate, unknown, malformed, or misprofiled checks.
          - Do not create semantic, advisory, or placeholder check modules.
          - Do not maintain generated directive copies or a separate canonical check registry.
          - Do not let checks select profiles or handle exemptions.
          - Do not require the optional repository map.

      - id: E-0.0.1
        dos:
          - Run selected work in dependency order.
          - Run every enabled stage and convention check before Jest.
          - Keep all failures and skip Jest if any earlier work fails.
          - Report thrown checks as failures and continue other executable checks.
          - Keep each completed stage result for convention checks.
          - Derive aggregate stages from selected deterministic rules.
        donts:
          - Do not silently omit executable selected checks or turn failures into warnings.
          - Do not report skipped, partial, unknown, or inapplicable work as passing.
          - Do not let exemptions suppress unrelated required work.
          - Do not recursively invoke the consumer's aggregate test script.
          - Do not add undeclared registry, release, deployment, or sync checks.

      - id: E-0.0.2
        dos:
          - Expose --help, --version, --debug-timing, --lint, --format, --format-check, --audit, and --pack.
          - Return informational output and exit code 0 for --help and --version without validation.
          - Require locally active npm 12 or later before validation.
          - Accept --debug-timing once and only before a focused path or tool mode.
          - Accept only --threads=<positive-count> as additional lint input.
          - Validate other mode arguments against documented mode-specific allowlists.
          - Preserve wrapper-selected formatting behavior, configuration, and required file coverage.
          - Keep --audit an explicitly requested tool mode rather than an implicit aggregate stage.
        donts:
          - Do not require npm verification for informational commands.
          - Do not accept wrapper options after the -- separator.
          - Do not forward unsupported arguments or let format-check write files.
          - Do not expose direct implementation tools as additional public commands.
          - Do not let diagnostic options change selected profiles or stages.
        examples:
          - "eliware-test --help"
          - "eliware-test --debug-timing --lint --threads=2"
          - "eliware-test --format-check"
          - "eliware-test --pack"

      - id: E-0.0.3
        dos:
          - Accept focused test paths through the public CLI under test/ or tests/.
          - Require repository-relative paths and reject absolute paths and parent traversal before resolution.
          - Reject missing, ambiguous, unsupported, or escaping focused paths before unrelated execution.
          - Keep stage selection independent of path focus.
          - Limit focused discovery, coverage, and diagnostics to the requested scope.
          - Forward arguments after -- only through the selected invocation contract.
          - Fail focused formatting when no valid resolved paths remain.
        donts:
          - Do not reinterpret package operations as test focus.
          - Do not broaden invalid focus or fall back to repository-wide execution.
          - Do not report unrelated-module coverage failures during focused execution.
        examples:
          - "eliware-test tests/example.test.mjs"
          - "eliware-test --debug-timing tests/example.test.mjs"

      - id: E-0.0.4
        dos:
          - Report each failure's ID, observed result, and full matching directive.
          - Include all directive examples and child rules.
          - List diagnostics in a fixed order.
          - Use code 0 for success and code 1 for other failures.
          - Use code 2 for Jest failure, code 3 for unexpected test output, and code 4 for low coverage.
          - Use codes 5 to 8 for lint, format, audit, and outdated dependency failures.
          - Use codes 9 to 12 for pack, typecheck, build, and convention failures.
          - Stop before Jest for invalid settings, arguments, or stage selection.
          - Use the highest applicable failure code without discarding diagnostics.
          - Run lint, format, audit, outdated, pack, typecheck, and build before conventions.
          - Run all convention checks before Jest.
          - Run Jest only when every earlier stage passes.
          - Cache each completed stage result for convention checks.
          - Print exactly Aggregate validation passed. after clean aggregate validation.
          - Report only the selected mode after mode-specific success.
        donts:
          - Do not truncate or paraphrase matched directives.
          - Do not change public exit semantics incidentally.
          - Do not emit aggregate success when diagnostics or failures remain.
          - Do not emit incidental logs or subprocess output during a clean normal run.
        examples:
          - "Aggregate validation passed."
          - "Failures retain all diagnostics and return the highest applicable exit code."

      - id: E-0.0.5
        dos:
          - Discover working-tree files including untracked and ignored files within each check's declared scope.
          - Exclude .git, node_modules, coverage, dist, build, and test-results directories from ordinary repository discovery.
          - Traverse iteratively and keep paths and resource use bounded.
          - Parse every document in generic YAML streams.
          - Inspect supported README links outside code spans and fenced blocks.
          - Support inline Markdown links and images.
          - Support full reference links and quoted HTML href and src attributes.
          - Support angle-bracket HTTP, HTTPS, and mailto links.
          - Resolve local targets within the checkout and local Markdown fragments against headings and HTML IDs.
          - Validate lockfile dependency-map shapes and references locally.
          - Resolve linked lockfile entries through their declared target package paths.
          - Inspect ignored tracked paths and symlink modes through the Git index.
          - Fail checks whose required local input or Git index cannot be read.
        donts:
          - Do not reject valid YAML streams solely for containing multiple documents.
          - Do not interpret unsupported Markdown extensions or structured-data paths as documentation links.
          - Do not fetch external documentation targets or fragments.
          - Do not probe registries while validating lockfiles.
          - Do not resolve symlink targets to determine tracked symlink status.
        examples:
          - "git ls-files --cached --stage -z"
          - "Git index mode 120000 identifies a tracked symlink."

      - id: E-0.0.6
        dos:
          - Invoke child processes with argument arrays, explicit working directories, and shell-disabled execution.
          - Copy the complete invoking environment defensively and apply only documented overrides.
          - Resolve executables through supported package resolution.
          - Bound captured stdout and stderr under an aggregate budget.
          - Preserve UTF-8 boundaries, surrogate pairs, and complete redaction markers.
          - Redact sensitive values in harness diagnostics, including PEM private keys.
          - Redact both encrypted and unencrypted PEM private keys.
          - Emit buffered text before a secret reaches the output limit.
          - Stop child processes within a platform-specific time limit.
        donts:
          - Do not depend on shell pipelines, quoting, arbitrary installation layouts, or unbounded capture.
          - Do not invoke Windows command shims through non-shell execution.
          - Do not selectively inherit or sanitize child environments.
          - Do not expose secrets through harness-owned diagnostics.
          - Do not promise complete secret detection or cleanup of every child process.

      - id: E-0.0.7
        dos:
          - Use consumer-resolvable Jest when available and bundled Jest otherwise.
          - Keep Jest execution rooted in the consumer repository.
          - Supply harness reporters and detailed coverage output without weakening configured requirements.
          - Execute requested Jest validation once with established ordering and lifecycle behavior.
          - Monitor suite progress during every run.
          - Enforce a 5-second maximum runtime for each test suite and a separate 15-second startup or between-suite no-progress deadline.
          - Report the current or last known suite and its time limit on termination.
          - Request graceful stop first.
          - Escalate after a time limit.
          - Confirm termination only after the child closes.
          - Fail within a bounded period if forced termination does not close the child.
          - Stream suite start, completion, and elapsed time under --debug-timing.
          - Keep timing output separate from captured failure output.
          - Fail unreadable or malformed console-output reports.
          - Accept only documented inherited NODE_OPTIONS warning and ESM flags.
        donts:
          - Do not impose a global run-duration limit.
          - Do not reset suite deadlines on output.
          - Do not require debug timing for watchdog enforcement.
          - Do not run each test separately to collect timing.
          - Do not buffer all timing until completion or expose raw timing payloads.
          - Do not interpret quotes or backslashes in NODE_OPTIONS or accept path-valued flags.

      - id: E-0.0.8
        dos:
          - Remove documented prior coverage candidates before tests.
          - Read current-run coverage candidates in fixed precedence order.
          - Continue past stale or unusable candidates and fail when none remain usable.
          - Validate maps and counters against source-derived Istanbul instrumentation.
          - Accept empty maps only when the matching instrumentation shape is empty.
          - Count positively executed entries as covered without weighting execution frequency.
          - Report file metrics, uncovered lines, and available statement, branch, and function details.
          - Include guidance to extend tests or refactor when needed for testability.
        donts:
          - Do not merge candidates or choose them by recency.
          - Do not preserve, restore, move, or rename prior coverage output.
          - Do not create temporary coverage directories.
          - Do not accept omitted instrumentation entries or unmatched map and counter keys.
          - Do not reduce failures to an exit code or undifferentiated percentage.

      - id: E-0.0.9
        dos:
          - Keep implementation native ESM, injectable, and covered by mirrored tests.
          - Keep one workflow's orchestration in its coordinator.
          - Move operations with separate change reasons into focused helpers.
          - Reuse bounded repository inventory and content caches.
          - Keep old cache values and byte counts when a refresh fails.
          - Remove both values exactly once when required.
          - Do not evict a pending refresh.
          - Keep successful directory listings when a later refresh fails.
          - Remove rejected inventory views for retry.
          - Prevent older parse completions from replacing newer cached results.
          - Test refresh failures followed by eviction and out-of-order parse completion.
        donts:
          - Do not split coordinators solely because their cohesive workflow has multiple phases.
          - Do not duplicate helper assertions in coordinator tests.
          - Do not let refresh failures corrupt accounting or stale completions replace newer results.

      - id: E-0.0.10
        dos:
          - Keep --pack limited to local package-content validation.
          - Provide opt-in smoke execution through npm run smoke -- --target <repository-path>.
          - Support smoke from the source checkout or installed harness directory.
          - Resolve source and target before changes.
          - Require an existing consumer with dependencies installed.
          - Pack the harness and install that exact tarball with npm install --no-save --package-lock=false.
          - Verify installed resolution and version before running the consumer's ordinary npm test.
          - Restore the prior manifest, lockfiles, installed harness directory, and its executable shims.
          - Snapshot only those exact files and the installed package directory.
          - Recreate captured Windows directory links as junctions.
          - Reject captured Windows file symlinks before mutation.
          - Report cleanup failures and keep exact recovery paths when restore fails.
        donts:
          - Do not install tarballs or run consumer suites during --pack.
          - Do not accept targets resolving inside the source checkout.
          - Do not rewrite dependency declarations or regenerate consumer lockfiles.
          - Do not snapshot ancestor directories such as node_modules/.bin or node_modules/@eliware.
          - Do not promise restoration of arbitrary consumer-created files.
          - Do not change system-wide links, create worktrees, run profile matrices, or align consumers.
          - Do not treat smoke success as release authorization.
        examples:
          - "npm run smoke -- --target ../disposable-consumer"
