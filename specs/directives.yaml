version: "14.0"
description: Sets rules for Eliware Test execution, checks, and public interfaces.
directives:
  - id: E-0.0
    dos:
      - Run deterministic repository validation through eliware-test.
      - Enforce each selected profile's bundled deterministic rules.
      - Use convention documents to define consumer requirements.
      - Reject overlapping runs in one worktree.
    donts:
      - Do not enforce semantic conventions or duplicate consumer requirements.
      - Do not require an external repository to load bundled checks.
      - Do not publish, deploy, sync, tag, push, or change remote data during validation.
      - Do not expose internal modules or injected helpers to consumers.
    children:
      - id: E-0.0.0
        dos:
          - Parse settings and arguments before validation.
          - Load specs/conventions/ordering/profile-combinations.yaml during preflight planning.
          - Validate required and prohibited profiles before check discovery.
          - Require one listed profile when a requiresAny list has values.
          - Allow an empty requiresAny list without an added requirement.
          - Fail preflight before check discovery when no listed profile is selected.
          - Require every repository to select general as a separate planning invariant.
          - Validate applied profile order with ordering/eliware-apply.yaml.
          - Match each profile pair's version.
          - Find profile check modules in src/checks/<profile>/ by directive ID filename.
          - Find combination check modules in src/checks/shared/ by directive ID filename.
          - Apply cross-profile rules from these harness directives.
          - Match each module name, exported ruleId, directive, and reported ID.
          - Show directive ancestry in check subfolders.
          - Check exemptions against the full bundled check tree.
          - Skip approved check exemptions and their discovered child checks.
          - Skip the rule and child checks when paths are omitted or empty.
          - Omit each listed repository-relative path from that rule's file inventory.
          - Match a path exactly when it has no wildcard.
          - Let * match in one path segment.
          - Let ** match zero or more path segments.
          - Apply path matches only to the named rule.
          - Apply path matches to checks that read the Git index.
          - Give each rule only its own path exclusions.
          - Expose excluded paths to checks that read fixed paths directly.
          - Read /eliware/docs/repo-map.yaml only when it exists and a convention needs it.
          - Validate repo-map.yaml with repo-map-schema.yaml beside it when that schema exists.
          - Compare matching repository exemption lists with package exemption lists.
          - Use an empty map list when the repository record omits exemptions.
          - Use an empty package list when package metadata omits exemptions.
          - Ignore object key order when comparing exemption records.
        donts:
          - Do not infer profiles from repository contents or runtime behavior.
          - Do not run validation with invalid required settings.
          - Do not accept duplicate, unknown, malformed, or misprofiled checks.
          - Do not load profile-combination policy from a consumer repository.
          - Do not create semantic, advisory, or placeholder check modules.
          - Do not maintain generated directive copies or a second canonical check
            registry.
          - Do not let checks select profiles or apply exemptions.
          - Do not require the optional repository map.
          - Do not use invalid repository map or schema data.

      - id: E-0.0.1
        dos:
          - Run selected work in dependency order.
          - Run each enabled stage and convention check before Jest.
          - Keep all failures.
          - Skip Jest when an earlier stage fails.
          - Report thrown checks with failure status.
          - Continue other executable checks.
          - Keep each completed stage result for convention checks.
          - Derive aggregate stages from selected deterministic rules.
        donts:
          - Do not silently omit executable selected checks or turn failures into warnings.
          - Do not report skipped, unfinished, unknown, or inapplicable work with passing status.
          - Do not let exemptions suppress unrelated required work.
          - Do not invoke the consumer's aggregate test script during aggregate validation.
          - Do not add undeclared registry, release, deployment, or sync checks.
          - Do not invoke CodeScope from automatic validation.

      - id: E-0.0.2
        dos:
          - Expose --help, --version, --debug-timing, --lint, --format, --format-check,
            --audit, and --pack.
          - Return informational output and exit code 0 for --help and --version without
            validation.
          - Require locally active npm 12 or newer before validation.
          - In this harness package, use node bin/eliware-test.mjs in the five shared
            scripts.
          - Accept --debug-timing one time and only before a focused path or tool mode.
          - Accept only --threads=<positive-count> for lint input.
          - Validate other mode arguments against documented mode-specific allowlists.
          - Preserve wrapper-selected formatting behavior, configuration, and required
            file coverage.
          - Run audit in aggregate validation.
          - Expose --audit for audit-only validation.
        donts:
          - Do not require npm verification for informational commands.
          - Do not accept wrapper options after the -- separator.
          - Do not forward unsupported arguments or let format-check write files.
          - Do not expose implementation tools or second public commands.
          - Do not let diagnostic options change selected profiles or stages.
        examples:
          - "eliware-test --help"
          - "eliware-test --debug-timing --lint --threads=2"
          - "eliware-test --format-check"
          - "eliware-test --pack"

      - id: E-0.0.3
        dos:
          - Accept one or more focused test paths through the public CLI in tests/.
          - Require repository-relative paths.
          - Reject absolute paths and parent traversal before resolution.
          - Reject missing, ambiguous, unsupported, or escaping focused paths before
            unrelated execution.
          - Do not let path focus change stage selection.
          - Limit focused discovery, coverage, and diagnostics to all requested test and
            source paths.
          - Run lint and format checks only on all requested test and source paths.
          - Run application or library layout checks only on all requested test and source
            paths.
          - Include mirrored-test, source-placement, barrel, and line-limit checks in
            focused layout validation.
          - Run other focused checks only when their full rules can use the focused file
            inventory.
          - Forward arguments after -- only through the selected invocation contract.
          - Fail focused formatting when resolution returns no valid paths.
        donts:
          - Do not interpret package operations for test selection.
          - Do not broaden invalid focus to repository-wide execution.
          - Do not report unrelated-module coverage failures during focused execution.
        examples:
          - "eliware-test tests/example.test.mjs"
          - "eliware-test tests/first.test.mjs tests/second.test.mjs"
          - "eliware-test --debug-timing tests/example.test.mjs"

      - id: E-0.0.4
        dos:
          - Report each failure's ID, observed result, and full matching directive.
          - Include all directive examples and child rules.
          - List diagnostics in a fixed order.
          - Use code 0 for success and code 1 for other failures.
          - Use code 2 for Jest failure, code 3 for unexpected test output, and code 4 for
            low coverage.
          - Use codes 5 to 8 for lint, format, audit, and outdated dependency failures.
          - Use codes 9 to 12 for pack, typecheck, build, and convention failures.
          - Stop before Jest for invalid settings, arguments, or stage selection.
          - Use the highest applicable failure code without discarding diagnostics.
          - Run profile-enabled lint, format, audit, outdated, pack, typecheck, and build
            before conventions.
          - Run all convention checks before Jest.
          - Run Jest only after all earlier stages pass.
          - Cache each completed stage result for convention checks.
          - Print an aggregate success summary after clean aggregate validation.
          - Report the number of convention checks that ran.
          - Report the number of Jest test suites and tests that ran.
          - Report zero lint warnings, format issues, audit issues, and pack issues after
            success.
          - Report total checks time by subtracting Jest time from validation time.
          - Report Jest time and total validation time in seconds to three decimal places.
          - "Put Exit-code: 0 on the final line of the aggregate success summary."
          - Count Jest test suites and tests from Jest run-complete results.
          - Count executed convention checks and completed non-Jest stages in the checks total.
          - Report the same counts and times after clean focused validation.
          - Report only the selected mode after mode-specific success.
        donts:
          - Do not truncate or paraphrase matched directives.
          - Do not change public exit semantics incidentally.
          - Do not show aggregate success when diagnostics or failures occur.
          - Do not show incidental logs or subprocess output during a clean standard run.
        examples:
          - "Aggregate validation passed."
          - "Checks: 42 | Test suites: 8 | Tests: 120"
          - "Lint warnings: 0 | Format issues: 0 | Audit issues: 0 | Pack issues: 0"
          - "Checks time: 1.200s | Jest time: 3.400s | Total time: 4.600s"
          - "Exit-code: 0"
          - "Failures retain all diagnostics."
          - "Failures return the highest applicable exit code."

      - id: E-0.0.5
        dos:
          - Find tracked, untracked, and ignored working-tree files in each
            check's declared scope.
          - Exclude .git, node_modules, coverage, dist, build, and test-results
            directories from ordinary repository discovery.
          - Traverse directories iteratively.
          - Keep paths and resource use bounded.
          - Parse all documents in generic YAML streams.
          - Reject YAML files larger than 100000 UTF-8 bytes before parsing.
          - Reject YAML files with more than 1000 lines.
          - Reject YAML lines longer than 100 characters. Do not count line endings.
          - Set the YAML alias expansion limit to 100 for each document.
          - Report the file path, observed value, and required limit for each YAML limit
            failure.
          - Inspect supported README links that are not in code spans or fenced blocks.
          - Support inline Markdown links and images.
          - Support full link definitions and quoted HTML href and src attributes.
          - Limit specification discovery to 10000 entries and 128 directory levels.
          - Support angle-bracket HTTP, HTTPS, and mailto links.
          - Resolve local targets in the checkout and local Markdown fragments against
            headings and HTML IDs.
          - Validate lockfile dependency-map shapes and references locally.
          - Resolve linked lockfile entries through their declared target package paths.
          - Inspect ignored tracked paths and symlink modes through the Git index.
          - Fail a check when a required local input or Git index cannot be read.
        donts:
          - Do not parse YAML above the stated byte, line, or alias limits.
          - Do not add a second memory cap for YAML parsing.
          - Do not reject valid YAML streams solely for containing multiple documents.
          - Do not use unsupported Markdown extensions or structured-data paths to identify
            documentation links.
          - Do not fetch external documentation targets or fragments.
          - Do not contact registries while validating lockfiles.
          - Do not resolve symlink targets to determine tracked symlink status.
        examples:
          - "git ls-files --cached --stage -z"
          - "Git index mode 120000 identifies a tracked symlink."

      - id: E-0.0.6
        dos:
          - Pass the child-command runner to stages and checks.
          - Mock all CLI calls in tests/**/*.test.mjs.
          - Do not let tests/**/*.test.mjs launch external CLI tools or child commands.
          - Mock file-system operations in tests/**/*.test.mjs.
          - Allow network access to localhost only in tests/**/*.test.mjs.
          - Use fake timers or injected fixed clocks in tests/**/*.test.mjs.
          - Mock child-command calls and all other external effects in tests/**/*.test.mjs.
          - Mock calls to Git, npm, audit, lint, format, pack, typecheck, build, Jest, and
            package scripts.
          - Invoke child processes with argument arrays, explicit working directories, and
            shell-disabled execution.
          - Copy the complete invoking environment defensively.
          - Apply only documented overrides.
          - Resolve executables through supported package resolution.
          - Limit captured stdout and stderr to one combined byte budget.
          - Preserve UTF-8 boundaries, surrogate pairs, and complete redaction markers.
          - Redact PEM key blocks and other sensitive values from harness diagnostics.
          - Redact encrypted and unencrypted PEM private keys.
          - Redact PEM public key blocks.
          - Write buffered text before a secret reaches the output limit.
          - Write live Jest output to `coverage/jest-console-output.json` while Jest runs.
          - After Jest closes, scan the saved output with existing secret-redaction rules.
          - When a rule matches, replace matched values in the saved output promptly.
          - Fail validation when redaction occurs. Report the output path and redaction
            result.
          - After a timeout or forced stop, scan incomplete output only after Jest closes.
          - Keep incomplete output when Jest does not close or the harness stops before
            scanning.
          - If the scan does not complete, report that the output may contain secrets.
          - Stop child commands before a platform-specific time limit.
        donts:
          - Do not modify files in tests/**/*.test.mjs.
          - Do not access external network services in tests/**/*.test.mjs.
          - Do not launch OS commands or command-line tools in tests/**/*.test.mjs.
          - Do not use wall-clock waits, sleeps, or uncontrolled timers in
            tests/**/*.test.mjs.
          - Do not require shell pipelines, quoting, arbitrary installation layouts, or
            unbounded capture.
          - Do not invoke Windows command shims through non-shell execution.
          - Do not selectively inherit or sanitize child environments.
          - Do not expose secrets through harness-owned diagnostics.
          - Do not promise full secret detection or cleanup of all child commands.
          - Do not print matched values.
          - Do not claim live output is redacted before it reaches disk.

      - id: E-0.0.7
        dos:
          - Use consumer-resolvable Jest when available and bundled Jest when it is not.
          - Keep Jest execution rooted in the consumer repository.
          - Supply harness reporters and detailed coverage output without weakening
            configured requirements.
          - Run Jest with --runInBand, --detectOpenHandles, and --no-cache.
          - Run requested Jest validation one time with established ordering and lifecycle
            behavior.
          - Report suite status during each run.
          - Enforce a 10-second limit for each test suite and a different
            15-second startup or between-suite no-progress deadline.
          - Report the current suite or the most recent suite and its time limit on stop.
          - Send a graceful stop signal first.
          - Escalate after a time limit.
          - Confirm termination only after the child closes.
          - Fail after a fixed period if forced termination does not close the child.
          - Write a startup timestamp and elapsed stage, check, and suite timings to
            coverage/eliware-test.log on every validation run.
          - Prefix each stage, check, and suite start line with elapsed seconds since startup.
          - Show the same timing lines on the console only when --debug-timing is set.
          - Do not combine timing output with captured failure output.
          - Fail unreadable or malformed console-output reports.
          - Accept only documented inherited NODE_OPTIONS warning and ESM flags.
        donts:
          - Do not impose a global run-duration limit.
          - Do not change suite deadlines when output arrives.
          - Do not require debug timing for watchdog enforcement.
          - Do not run each test alone to collect timing.
          - Do not buffer all timing until the run stops.
          - Do not expose raw timing payloads.
          - Do not interpret quotes or backslashes in NODE_OPTIONS or accept path-valued
            flags.

      - id: E-0.0.8
        dos:
          - Delete prior files in the consumer coverage directory before each Jest run.
          - Keep the current-run timing log while clearing other prior coverage files.
          - Keep all temporary coverage directories in the consumer repository.
          - Write current coverage reports and Jest console output to the consumer
            coverage directory.
          - Write Jest console output while Jest runs.
          - Keep test code read-only.
          - Use unit tests with mocked filesystem or process results for file and process
            behavior.
          - Keep current-run coverage reports and Jest output after Jest completes.
          - Keep incomplete Jest output after a timeout or forced stop.
          - Read coverage data from the consumer coverage directory.
          - Validate maps and counters against source-derived Istanbul instrumentation.
          - Accept empty maps only when the matching instrumentation shape is empty.
          - Count positively executed entries for coverage without weighting execution
            frequency.
          - Report file metrics, uncovered lines, and available statement, branch, and
            function details.
          - Include guidance to extend tests or refactor when needed for testability.
        donts:
          - Do not merge candidates or select them by recency.
          - Do not combine harness-owned coverage reports or validation output with test
            side effects.
          - Do not delete current-run coverage reports or Jest output after Jest completes.
          - Do not delete the current-run timing log before or after Jest runs.
          - Do not preserve or restore prior coverage output.
          - Do not create validation or smoke temporary files in system temp or user
            folders.
          - Do not let test code create files or directories.
          - Do not use temporary fixture repositories in tests.
          - Do not use in-memory filesystems in tests.
          - Do not accept omitted instrumentation entries or unmatched map and counter
            keys.
          - Do not convert failures to an exit code or one percentage.

      - id: E-0.0.9
        dos:
          - Keep implementation native ESM, injectable, and covered by mirrored tests.
          - Allow the harness to declare and import Oxlint and Prettier in its dependencies.
          - Invoke Oxlint and Prettier through harness validation stages.
          - Keep one workflow's orchestration in its coordinator.
          - Move operations with different reasons for change into focused helpers.
          - In this harness package, allow direct dependencies on @jest/globals, jest, and
            istanbul-lib-instrument.
          - In this harness package, allow istanbul-lib-instrument imports and direct Jest
            commands outside package scripts.
          - Apply these test-tool allowances only to @eliware/test.
          - Use bounded repository inventory and content caches.
          - Keep prior cache values and byte counts when a refresh fails.
          - Remove each value one time when required.
          - Do not evict a pending refresh.
          - Keep valid directory listings if a subsequent refresh fails.
          - Remove rejected inventory views for retry.
          - Prevent older parse completions from replacing newer cached results.
          - Test refresh failures, eviction, and parse results that return out of order.
        donts:
          - Do not split coordinators solely because their cohesive workflow has multiple
            phases.
          - Do not duplicate helper assertions in coordinator tests.
          - Do not let refresh failures corrupt accounting or stale completions replace
            newer results.

      - id: E-0.0.10
        dos:
          - Keep --pack for local package-content validation only.
          - Set this package's pack command to node bin/eliware-test.mjs --pack.
          - Provide opt-in smoke execution through npm run smoke -- --target
            <repository-path>.
          - Support smoke from the source checkout or installed harness directory.
          - Resolve source and target before changes.
          - Require an existing consumer with dependencies installed.
          - Pack the harness.
          - Install that exact tarball with npm install --no-save --package-lock=false.
          - Verify installed resolution and version.
          - In smoke mode, run the consumer's npm test after tarball installation and
            verification.
          - Restore the prior manifest, lockfiles, installed harness directory, and its
            executable shims.
          - Snapshot only those exact files and the installed package directory.
          - Create Windows junctions from captured directory links.
          - Reject captured Windows file symlinks before mutation.
          - Report cleanup failures.
          - Keep exact recovery paths when restore fails.
        donts:
          - Do not install tarballs during --pack.
          - Do not run consumer suites during --pack.
          - Do not accept targets that resolve to the source checkout or its child directories.
          - Do not rewrite dependency declarations or regenerate consumer lockfiles.
          - Do not snapshot parent directories like node_modules/.bin or
            node_modules/@eliware.
          - Do not promise restoration of arbitrary consumer-created files.
          - Do not change system-wide links, create worktrees, run profile matrices, or
            align consumers.
          - Do not use smoke success to authorize a release.
        examples:
          - "npm run smoke -- --target ../disposable-consumer"

      - id: E-0.0.11
        dos:
          - Use package.json.eliware.apply to classify each repository.
          - Use package.json.eliware.apply to select enabled profiles.
          - Read required and prohibited profile combinations from
            specs/conventions/ordering/profile-combinations.yaml.
          - Enforce profile combinations during preflight planning before check discovery.
          - Require every repository to select general as a separate planning invariant.
          - Put only universal repository rules and checks in general.
          - Keep each profile's rules unique from general and all profiles that can apply
            with it.
          - Keep child-profile rules unique from general and their parent profiles.
          - Allow equivalent rules in mutually exclusive profile branches when each branch
            needs them.
          - Put profile-specific rules and checks in that profile.
          - Enable profile-specific rules and checks only when selected.
          - Put rules and checks that require multiple profiles in a shared layer.
          - Keep multi-profile rules and checks apart from profile checks and shared
            utility helpers.
          - Run shared composition checks only when their declared profile combination
            applies.
          - Map each deterministic requirement to one executable check in its owning
            profile or the shared composition layer.
          - Run profile-required stages only when their profile applies.
          - Run package packing only when npm-published applies.
        donts:
          - Do not put conditional profile rules or checks in general.
          - Do not duplicate enforcement between general and a profile or between profiles
            that can apply together.
          - Do not reject shared rules across profiles that cannot apply together.
          - Do not copy profile-combination policy into convention profile files.
          - Do not infer profiles from repository contents or runtime behavior.
          - Do not run checks or stages for unselected profiles.
          - Do not keep profiles without unique deterministic or semantic requirements.
          - Do not run package packing when npm-published does not apply.

      - id: E-0.0.12
        dos:
          - Put checks for rules that require multiple selected profiles in
            src/checks/shared/.
          - Declare each shared check's owning profile and required profiles in its module.
          - Run a shared check only when each required profile applies.
          - Mirror each shared check in tests/checks/shared/.
          - Keep profile-only rules and checks in their selected profile.
          - Read cross-profile canonical order data from specs/conventions/ordering/.
          - Order package.json keys by ordering/package-json.yaml.
          - Order package.json.eliware.apply entries by ordering/eliware-apply.yaml.
          - Order README.md sections and badges by ordering/readme-sections.yaml.
          - Order AGENTS.md sections by ordering/agents-sections.yaml.
          - Order specification indexes by ordering/specification-indexes.yaml.
          - Order CI validation steps by ordering/ci-workflow.yaml.
          - Order publication profiles and list canonical workflow files in
            ordering/publication-workflow.yaml.
          - Define publisher job order in the canonical workflow files.
          - Order package files by ordering/package-files.yaml when npm-published applies.
          - Include shared README.md or AGENTS.md sections for each profile that requires them.
          - Add each shared README.md section one time at its first required location.
          - Show the npm badge and package link only when npm-published applies.
          - Use .github/workflows/npm.yaml when npm-published applies.
          - Use .github/workflows/ghcr.yaml when ghcr-published applies.
          - Publish only on canonical `vMAJOR.MINOR.PATCH` tags that match
            package.json.version.
          - Require one unconditional Ubuntu validation job before publication.
          - Give publication jobs only the permissions required by their selected profiles.
          - Do not run npm test again in a publisher job.
          - Do not use continue-on-error for publication or required verification steps.
        donts:
          - Do not put combination checks in profile directories or shared utility
            directories.
          - Do not copy canonical order values into check modules.
          - Do not run shared checks when a required profile does not apply.
          - Do not add a publication workflow unless a publication profile applies.
