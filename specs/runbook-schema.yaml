$schema: https://json-schema.org/draft/2020-12/schema
title: Eliware runbook schema
type: object
required:
  - schema-version
  - title
  - purpose
  - owner
  - boundaries
  - prerequisites
  - steps
properties:
  schema-version:
    const: 13
  title:
    type: string
    minLength: 1
    pattern: \S
  purpose:
    type: string
    minLength: 1
    pattern: \S
  owner:
    type: string
    minLength: 1
    pattern: \S
  boundaries:
    type: string
    minLength: 1
    pattern: \S
  prerequisites:
    type: array
    items:
      type: string
      minLength: 1
      pattern: \S
  steps:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
      pattern: \S
additionalProperties: false
