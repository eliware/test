$schema: https://json-schema.org/draft/2020-12/schema
title: Eliware runbook schema
type: object
required:
  - schema-version
  - title
  - steps
properties:
  schema-version:
    const: 12
  title:
    type: string
    minLength: 1
    pattern: \S
  steps:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
      pattern: \S
additionalProperties: false
