$schema: https://json-schema.org/draft/2020-12/schema
title: Eliware runbook schema
type: object
required:
  - schema-version
  - title
  - purpose
  - owner
  - boundaries
  - prerequisites
  - steps
properties:
  schema-version:
    const: 13
  title:
    type: string
    minLength: 1
    pattern: \S
  purpose:
    type: string
    minLength: 1
    pattern: \S
  owner:
    type: string
    minLength: 1
    pattern: \S
  boundaries:
    type: string
    minLength: 1
    pattern: \S
  prerequisites:
    type: array
    items:
      type: string
      minLength: 1
      pattern: \S
  steps:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
      pattern: \S
additionalProperties: false
examples:
  - schema-version: 13
    title: Inspect service
    purpose: Check service status
    owner: SysAdmin
    boundaries: Do not change data.
    prerequisites: []
    steps:
      - Check service status.
      - Confirm that the service responds.
  - schema-version: 13
    title: Deploy service
    purpose: Deploy an approved release
    owner: DevOps
    boundaries: Do not change service settings without approval.
    prerequisites:
      - Get approval from Eli.
    steps:
      - Check the approved release.
      - Deploy the release.
      - Verify service health.
